<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ernst Unit 2" />
  <meta name="theme-color" content="#58cc02" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2358cc02'/%3E%3Ctext x='90' y='122' font-size='100' text-anchor='middle'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E" />
  <title>Ernst's Unit 2 Quest · 10-Level Oefenpad</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --green: #58cc02;
      --green-dark: #46a302;
      --green-soft: #e9fad9;
      --blue: #1cb0f6;
      --blue-dark: #0095db;
      --blue-soft: #e6f7ff;
      --purple: #ce82ff;
      --purple-dark: #9b51e0;
      --purple-soft: #f5ebff;
      --gold: #ffc800;
      --gold-dark: #e09f00;
      --gold-soft: #fff8d6;
      --orange: #ff9600;
      --orange-dark: #e07b00;
      --red: #ff4b4b;
      --red-dark: #d93636;
      --red-soft: #ffecec;
      --gray: #e5e5e5;
      --gray-dark: #afafaf;
      --text: #3c3c3c;
      --muted: #777777;
      --border: #e5e5e5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ============ TOP BAR (MAP VIEW) ============ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
    }
    .topbar-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.05rem;
      color: var(--green-dark);
    }
    .stats-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f1f5f9;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .lang-group {
      display: inline-flex;
      background: #f1f5f9;
      border-radius: 10px;
      padding: 2px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--muted);
    }
    .lang-btn.active {
      background: #fff;
      color: var(--blue-dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .icon-btn {
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
    }
    .icon-btn.on {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    /* ============ PATH MAP VIEW ============ */
    .map-container {
      max-width: 640px;
      margin: 20px auto 64px;
      padding: 0 16px;
    }
    .unit-banner {
      color: #fff;
      border-radius: 20px;
      padding: 16px 20px;
      margin: 24px 0 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .unit-banner.sec1 { background: linear-gradient(135deg, #58cc02, #3cb300); box-shadow: 0 5px 0 var(--green-dark); margin-top: 4px; }
    .unit-banner.sec2 { background: linear-gradient(135deg, #a855f7, #7c3aed); box-shadow: 0 5px 0 #6d28d9; }
    .unit-banner.sec3 { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 5px 0 #b45309; }
    .unit-banner h2 { margin: 0; font-size: 1.12rem; }
    .unit-banner p { margin: 3px 0 0; font-size: 0.84rem; opacity: 0.94; }
    .unit-progress-pill {
      background: rgba(255,255,255,0.22);
      border-radius: 12px;
      padding: 6px 12px;
      font-weight: 900;
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .path-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 6px 0 8px;
    }
    .path-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .path-connector {
      width: 6px;
      height: 18px;
      border-radius: 99px;
      background: var(--gray);
    }
    .path-connector.done { background: var(--green); }

    .node-row { display: flex; align-items: center; gap: 14px; }
    .node-btn {
      width: 80px;
      height: 74px;
      border-radius: 50%;
      border: none;
      font-size: 1.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.12s;
      user-select: none;
    }
    .node-btn:active:not(:disabled) { transform: translateY(4px); }
    .node-btn.locked { background: var(--gray); box-shadow: 0 7px 0 #cfcfcf; color: #999; cursor: not-allowed; }
    .node-btn.current { background: var(--green); box-shadow: 0 7px 0 var(--green-dark); color: #fff; animation: gentlePulse 1.8s infinite; }
    .node-btn.current.boss { background: #9333ea; box-shadow: 0 7px 0 #6b21a8; }
    .node-btn.current.exam { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dark); }
    .node-btn.done { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dark); color: #fff; }

    .node-check {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--green);
      color: #fff;
      border: 3px solid #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.82rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .start-bubble {
      position: absolute;
      top: -34px;
      background: #fff;
      color: var(--green-dark);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 3px 12px;
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      white-space: nowrap;
      animation: floatY 1.6s ease-in-out infinite;
    }
    .node-label { margin-top: 9px; text-align: center; max-width: 260px; }
    .node-title { font-weight: 900; font-size: 0.94rem; color: var(--text); }
    .node-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .robot-buddy { font-size: 2.2rem; animation: floatY 2.2s ease-in-out infinite; }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .parent-bar {
      margin-top: 28px;
      padding: 12px 16px;
      background: #fff;
      border: 2px dashed var(--border);
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.83rem;
      color: var(--muted);
    }

    /* ============ FULLSCREEN LESSON VIEW ============ */
    .lesson-shell { display: none; min-height: 100vh; flex-direction: column; background: #fff; }
    .lesson-shell.active { display: flex; }
    .map-shell.hidden { display: none; }

    .lesson-top {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 18px 10px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .close-btn {
      border: none;
      background: transparent;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gray-dark);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 10px;
    }
    .close-btn:hover { background: #f1f5f9; color: var(--text); }

    .duo-bar-track { flex: 1; height: 16px; background: var(--gray); border-radius: 999px; overflow: hidden; }
    .duo-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), #7ce622); border-radius: 999px; transition: width 0.3s ease; }
    .lesson-counter { font-weight: 900; font-size: 0.9rem; color: var(--muted); min-width: 56px; text-align: right; }

    .lesson-body {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px 165px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--purple-dark);
      margin-bottom: 8px;
    }
    .step-badge.retry { color: var(--orange-dark); }

    .q-title { font-size: 1.42rem; font-weight: 900; margin: 0 0 8px; color: var(--text); line-height: 1.35; }
    .q-sub { font-size: 0.96rem; color: var(--muted); margin: 0 0 18px; }
    .bilingual-zh { display: block; font-size: 0.85em; font-weight: 600; color: #64748b; margin-top: 3px; }

    .duo-btn {
      border: none;
      border-radius: 16px;
      padding: 14px 26px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 0.1s;
      color: #fff;
      background: var(--green);
      box-shadow: 0 5px 0 var(--green-dark);
    }
    .duo-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--green-dark); }
    .duo-btn:disabled { background: var(--gray); box-shadow: 0 5px 0 #cfcfcf; color: #999; cursor: not-allowed; }
    .duo-btn.purple { background: #9333ea; box-shadow: 0 5px 0 #6b21a8; }
    .duo-btn.red { background: var(--red); box-shadow: 0 5px 0 var(--red-dark); }
    .duo-btn.outline { background: #fff; color: var(--text); border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }

    /* Choice tiles */
    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
    .choice-grid.single-col { grid-template-columns: 1fr; }
    @media (max-width: 560px) { .choice-grid { grid-template-columns: 1fr; } }

    .choice-tile {
      border: 2px solid var(--border);
      border-bottom-width: 5px;
      background: #fff;
      border-radius: 16px;
      padding: 15px 16px;
      font-size: 1.04rem;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: all 0.12s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .choice-tile:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
    .choice-tile.selected { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }
    .choice-tile.correct { border-color: var(--green); background: var(--green-soft); color: #2b7000; }
    .choice-tile.wrong { border-color: var(--red); background: var(--red-soft); color: #a81c1c; }
    .tile-num {
      width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.78rem; color: var(--muted); flex-shrink: 0;
    }

    /* Word-bank sentence builder (Duolingo signature!) */
    .sentence-slot {
      min-height: 68px;
      border: 2.5px dashed #cbd5e1;
      border-radius: 16px;
      padding: 10px 12px;
      background: #f8fafc;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .sentence-slot.has-words { border-style: solid; border-color: var(--blue); background: #fcfeff; }
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 6px 0;
    }
    .wb-chip {
      border: 2px solid var(--border);
      border-bottom-width: 4px;
      background: #fff;
      border-radius: 14px;
      padding: 10px 15px;
      font-size: 1.04rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.1s;
    }
    .wb-chip:active:not(:disabled) { transform: translateY(2px); }
    .wb-chip.placed { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }
    .wb-chip.used { opacity: 0.22; pointer-events: none; }

    /* Match pairs */
    .match-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
    .match-col { display: flex; flex-direction: column; gap: 10px; }
    .match-tile {
      border: 2px solid var(--border);
      border-bottom-width: 5px;
      background: #fff;
      border-radius: 14px;
      padding: 13px 12px;
      font-size: 0.98rem;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      transition: all 0.12s;
    }
    .match-tile.selected { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }
    .match-tile.matched { border-color: var(--green); background: var(--green-soft); color: #2b7000; opacity: 0.42; pointer-events: none; }

    /* Spelling */
    .spell-card {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .spell-input {
      width: 100%;
      padding: 15px 18px;
      font-size: 1.25rem;
      font-weight: 800;
      border: 2px solid #cbd5e1;
      border-bottom-width: 5px;
      border-radius: 16px;
      outline: none;
    }
    .spell-input:focus { border-color: var(--blue); background: #fcfeff; }

    .letter-diff { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; font-family: Consolas, monospace; font-size: 1.05rem; }
    .ld-char { padding: 2px 6px; border-radius: 6px; font-weight: 900; }
    .ld-ok { background: #bbf7d0; color: #14532d; }
    .ld-bad { background: #fecaca; color: #991b1b; text-decoration: underline; }

    /* Teach Card */
    .teach-card { border: 2px solid #e2e8f0; border-radius: 18px; padding: 18px; background: #fafcff; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 8px; font-weight: 900; }
    .pill-do { background: #dbeafe; color: #1e40af; }
    .pill-does { background: #fef08a; color: #854d0e; }
    .pill-did { background: #f3e8ff; color: #6b21a8; }
    .pill-bare { background: #dcfce7; color: #166534; }
    .pill-err { background: #fee2e2; color: #991b1b; text-decoration: line-through; }

    .mini-switch { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .mini-switch button {
      padding: 8px 13px; border-radius: 12px; border: 2px solid var(--border); background: #fff; font-weight: 800; cursor: pointer;
    }
    .mini-switch button.active { border-color: var(--purple-dark); background: var(--purple-soft); color: #5b21b6; }

    .clue-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 18px; }
    .clue-pill { padding: 10px 18px; border-radius: 14px; font-size: 1.18rem; font-weight: 900; border: 2.5px solid #cbd5e1; background: #fff; }
    .clue-pill.today { background: #eff6ff; border-color: #60a5fa; color: #1e40af; }
    .clue-pill.past { background: #f3e8ff; border-color: #a78bfa; color: #5b21b6; }
    .clue-pill.person { background: #fefce8; border-color: #facc15; color: #854d0e; }

    /* Footer */
    .lesson-footer { position: fixed; bottom: 0; left: 0; right: 0; border-top: 2px solid var(--border); background: #fff; padding: 16px 20px; z-index: 30; }
    .lesson-footer.ok { background: var(--green-soft); border-top-color: #b7eb8f; }
    .lesson-footer.err { background: var(--red-soft); border-top-color: #ffa39e; }
    .footer-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .fb-text { flex: 1; min-width: 200px; }
    .fb-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 3px; }
    .lesson-footer.ok .fb-title { color: #2b7000; }
    .lesson-footer.err .fb-title { color: #b91c1c; }
    .fb-detail { font-size: 0.9rem; color: var(--text); font-weight: 600; }
    .fb-why {
      margin-top: 6px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
      border-left: 4px solid var(--red);
      font-size: 0.86rem;
      line-height: 1.4;
    }
    .lesson-footer.ok .fb-why { border-left-color: var(--green); }

    /* Victory */
    .victory-box { text-align: center; padding: 16px 10px; }
    .cijfer-circle {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      width: 150px; height: 150px; border-radius: 50%;
      background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fde047;
      font-size: 2.7rem; font-weight: 900; margin: 14px 0;
      box-shadow: 0 10px 26px rgba(37,99,235,0.28);
    }
    .cijfer-circle span { font-size: 0.85rem; color: #fff; font-weight: 700; }
    .review-list { text-align: left; margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .review-item { padding: 10px 14px; border-radius: 12px; border: 1.5px solid #fecaca; background: #fff5f5; font-size: 0.9rem; }

    /* Guide Modal & Teach Grids */
    .guide-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.55);
      padding: 16px;
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
    }
    .guide-modal.open { display: flex; }
    .guide-sheet {
      background: #fff;
      border-radius: 22px;
      max-width: 720px;
      width: 100%;
      margin: 18px auto 36px;
      padding: 20px;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.25);
    }
    .guide-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 14px;
    }
    .guide-sec {
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      background: #fafcff;
    }
    .guide-sec h3 { margin: 0 0 8px; font-size: 1rem; color: #1e3a8a; }
    .veg-mini-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .veg-mini-card {
      border: 1.5px solid #bbf7d0;
      background: #f0fdf4;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.86rem;
    }
    .veg-mini-card strong { font-size: 1rem; color: #14532d; }
    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      margin-top: 8px;
      background: #fff;
    }
    .mini-table th, .mini-table td {
      border: 1px solid #ddd6fe;
      padding: 6px 8px;
      text-align: left;
    }
    .mini-table th { background: #ede9fe; color: #4c1d95; }
  </style>
</head>
<body>

  <!-- ================= MAP VIEW ================= -->
  <div class="map-shell" id="map-shell">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand-mini">🤖 <span id="brand-txt"></span></div>
        <div class="stats-row">
          <span class="stat-chip">⚡ <span id="stat-xp">0</span> XP</span>
          <span class="stat-chip">🔥 <span id="stat-streak">0</span></span>
          <span class="stat-chip">📖 <span id="stat-words">0</span>/40</span>
        </div>
        <div class="controls-row">
          <div class="lang-group">
            <button class="lang-btn active" id="lang-nl" onclick="setLang('nl')">🇳🇱 NL</button>
            <button class="lang-btn" id="lang-both" onclick="setLang('both')">🌐 NL+中</button>
            <button class="lang-btn" id="lang-zh" onclick="setLang('zh')">🇨🇳 中文</button>
          </div>
          <button class="icon-btn on" id="btn-speech" onclick="toggleSpeech()">🔊</button>
          <button class="icon-btn on" id="btn-sfx" onclick="toggleSfx()">🎵</button>
          <button class="icon-btn" id="btn-guide-map" onclick="openGuide()">📘</button>
        </div>
      </div>
    </div>

    <div class="map-container">
      <div id="map-sections"></div>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("ernst_unit2_duo_v1");
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
          if (state.unlockedLevel > 10) state.unlockedLevel = 10;
        }
      } catch (e) {}
    }
    function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

    function t(nl, zh) { return state.lang === "nl" ? nl : (state.lang === "zh" ? zh : `${nl} / ${zh}`); }
    function tBlock(nl, zh) {
      if (state.lang === "nl") return escapeHtml(nl);
      if (state.lang === "zh") return escapeHtml(zh);
      return `${escapeHtml(nl)}<span class="bilingual-zh">${escapeHtml(zh)}</span>`;
    }
    function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function normalizeAns(s) { return (s || "").trim().replace(/[’`]/g, "'").replace(/\s+/g, " ").toLowerCase(); }

    function renderLetterDiff(typed, target) {
      const u = typed.trim();
      let html = '<div class="letter-diff">';
      for (let i = 0; i < target.length; i++) {
        const ch = target[i];
        const ok = u[i] && u[i].toLowerCase() === ch.toLowerCase();
        html += `<span class="ld-char ${ok ? "ld-ok" : "ld-bad"}">${ch === " " ? "␣" : escapeHtml(ch)}</span>`;
      }
      return html + "</div>";
    }

    let audioCtx = null;
    function playTone(type) {
      if (!state.sfxOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const notes = type === "win" ? [523, 659, 784, 1046] : (type === "ok" ? [523, 659] : [220, 175]);
        notes.forEach((freq, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type = type === "err" ? "sawtooth" : "triangle";
          o.frequency.setValueAtTime(freq, now + i * 0.08);
          g.gain.setValueAtTime(0.12, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.18);
          o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.18);
        });
      } catch (e) {}
    }

    function speakEn(text) {
      if (!state.speechOn || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);

        window.speechSynthesis.speak(u);

    }

          <div class="unit-banner ${sec.cls}">
            <div>
              <h2>${escapeHtml(state.lang === "zh" ? sec.titleZh : sec.titleNl)}</h2>
              <p>${escapeHtml(state.lang === "zh" ? sec.subZh : sec.subNl)}</p>
            </div>
            <div class="unit-progress-pill">${secDone} / ${secLevels.length}</div>
          </div>
          <div class="path-wrap">${nodesHtml}</div>`;
      }).join("");

      document.getElementById("parent-hint").textContent = state.parentMode
        ? t("🔑 Ouder-modus AAN: alle 10 levels zijn vrij te kiezen.", "🔑 家长自由模式已开：可点击任意关卡直接进入。")
        : t("🔒 Focus-modus: Ernst speelt één level per keer vrij (totaal ca. 45–55 min).", "🔒 专注解锁模式：一关解锁一关，全套 10 关约 45–55 分钟（可分 2–3 次完成）。");
      const pmBtn = document.getElementById("btn-parent-mode");
      pmBtn.textContent = state.parentMode ? t("🔑 Ouder-modus: AAN", "🔑 家长自由选关：开") : t("🔑 Ouder-modus", "🔑 家长自由选关");
      pmBtn.classList.toggle("on", state.parentMode);
      document.getElementById("btn-reset").textContent = t("🔄 Reset", "🔄 重置进度");
    }

    // =====================================================
    // 5. 全 10 关关卡生成器（100% 覆盖 40 词 + 全部语法）
    // =====================================================
    let lesson = null;

    function buildLevelSteps(lvId) {
      const steps = [];

      if (lvId === 1) {
        // Level 1: 先看蔬菜口诀卡，再玩 2 轮消消乐配对 + 5 选择
        steps.push({ kind: "teach_veg", tagNl: "Stap 1 · Groente-ezelsbruggetjes", tagZh: "第 1 步 · 先看 9 个蔬菜拆词秘籍" });
        const vShuf = shuffle(VEG_WORDS);
        steps.push({ kind: "match", words: vShuf.slice(0, 5), tagNl: "Groente Koppelen 1/2", tagZh: "蔬菜消消乐 1/2" });
        steps.push({ kind: "match", words: vShuf.slice(4, 9), tagNl: "Groente Koppelen 2/2", tagZh: "蔬菜消消乐 2/2" });
        shuffle(VEG_WORDS).slice(0, 5).forEach(w => {
          const opts = shuffle([w, ...shuffle(VEG_WORDS.filter(x => x.id !== w.id)).slice(0, 3)]);
          steps.push({ kind: "word_choice", word: w, options: opts, tagNl: "Groente Meerkeuze", tagZh: "蔬菜快选" });
        });
      }
      else if (lvId === 2) {
        // Level 2: 9 个蔬菜词全拼写
        shuffle(VEG_WORDS).forEach(w => {
          steps.push({ kind: "word_spell", word: w, tagNl: "Groente Spellen", tagZh: "蔬菜拼写 Boss" });
        });
      }
      else if (lvId === 3) {
        // Level 3: Lesson 1 (10 词) + Lesson 2 非蔬菜 (5 词) = 15 词全覆盖！
        const l12 = shuffle(VOCAB.filter(w => w.lesson === 1 || (w.lesson === 2 && !w.veg)));
        steps.push({ kind: "match", words: l12.slice(0, 5), tagNl: "Lesson 1 & 2 · Koppelen", tagZh: "Lesson 1 & 2 消消乐" });
        l12.slice(5, 10).forEach(w => {
          const opts = shuffle([w, ...shuffle(NON_VEG_WORDS.filter(x => x.id !== w.id)).slice(0, 3)]);
          steps.push({ kind: "word_choice", word: w, options: opts, tagNl: "Lesson 1 & 2 · Meerkeuze", tagZh: "词汇快选" });
        });
        l12.slice(10, 15).forEach(w => {
          steps.push({ kind: "word_spell", word: w, tagNl: "Lesson 1 & 2 · Spellen", tagZh: "核心词拼写" });
        });
        // 把配对的 5 词中随机抽 2 个再拼写巩固
        l12.slice(0, 2).forEach(w => {
          steps.push({ kind: "word_spell", word: w, tagNl: "Lesson 1 & 2 · Extra Spellen", tagZh: "巩固拼写" });
        });
      }
      else if (lvId === 4) {
        // Level 4: Lesson 3 (10 词) + Lesson 4 非蔬菜 (6 词) = 16 词全覆盖！
        const l34 = shuffle(VOCAB.filter(w => w.lesson === 3 || (w.lesson === 4 && !w.veg)));
        steps.push({ kind: "match", words: l34.slice(0, 5), tagNl: "Lesson 3 & 4 · Koppelen", tagZh: "Lesson 3 & 4 消消乐" });
        l34.slice(5, 10).forEach(w => {
          const opts = shuffle([w, ...shuffle(NON_VEG_WORDS.filter(x => x.id !== w.id)).slice(0, 3)]);
          steps.push({ kind: "word_choice", word: w, options: opts, tagNl: "Lesson 3 & 4 · Meerkeuze", tagZh: "词汇快选" });
        });
        l34.slice(10, 16).forEach(w => {
          steps.push({ kind: "word_spell", word: w, tagNl: "Lesson 3 & 4 · Spellen", tagZh: "核心词拼写" });
        });
      }
      else if (lvId === 5) {
        // Level 5: 先学 Grammatica 1 & 2 秘籍卡，再拼句 + 做题
        steps.push({ kind: "teach_g12", tagNl: "Uitleg · Grammatica 1 & 2", tagZh: "课前秘籍 · would like & have" });
        SENTENCE_BUILDS.filter(s => s.group === "g1" || s.group === "g2").forEach(sb => {
          steps.push({ kind: "sentence_build", sb, tagNl: "Zin Bouwen · Grammatica 1–2", tagZh: "多邻国词块拼句" });
        });
        shuffle(GRAMMAR_QUESTIONS.filter(q => q.group === "g1" || q.group === "g2")).slice(0, 8).forEach(q => {
          steps.push({ kind: "grammar", q, tagNl: "Grammatica 1 & 2", tagZh: "语法实战" });
        });
      }
      else if (lvId === 6) {
        // Level 6: Do / Does / Did 3大法则时间机 + 全部 12 轮闪电反射！
        steps.push({ kind: "teach_ddd", tagNl: "Stap 1 · Snap Do / Does / Did", tagZh: "第 1 步 · 时间机互动教学" });
        shuffle(FLITS_BANK).forEach(f => {
          steps.push({ kind: "flits", flits: f, tagNl: "Flits-Reflex", tagZh: "闪电反射训练" });
        });
      }
      else if (lvId === 7) {
        // Level 7: 先快速温习 3 大口诀，再打 Do / Does / Did Boss
        steps.push({ kind: "teach_ddd", tagNl: "Snelle check · 3 Trucs", tagZh: "战前温习 · Do/Does/Did 3 大口诀" });
        SENTENCE_BUILDS.filter(s => s.group === "g3").forEach(sb => {
          steps.push({ kind: "sentence_build", sb, tagNl: "Zin Bouwen · Do / Does / Did", tagZh: "拼句避坑实战" });
        });
        shuffle(GRAMMAR_QUESTIONS.filter(q => q.group === "g3")).slice(0, 10).forEach(q => {
          steps.push({ kind: "grammar", q, tagNl: "Do / Does / Did Boss", tagZh: "时态与简答强化" });
        });
      }
      else if (lvId === 8) {
        // Level 8: 先看 Lesson 5 Phrases & Sunday Roast 小故事，再做题 + 蔬菜二刷
        steps.push({ kind: "teach_l5", tagNl: "Uitleg · Phrases & Sunday Roast", tagZh: "课前秘籍 · Lesson 5 句型与故事" });
        GRAMMAR_QUESTIONS.filter(q => q.group === "phrases").forEach(q => {
          steps.push({ kind: "grammar", q, tagNl: "Lesson 5 · Phrases & Sunday Roast", tagZh: "Lesson 5 句型与文化" });
        });
        const hardVegIds = ["w16", "w35", "w38", "w39", "w11", "w15"];
        shuffle(hardVegIds).forEach(id => {
          const w = VOCAB.find(x => x.id === id);
          steps.push({ kind: "word_spell", word: w, tagNl: "Groente Extra Check!", tagZh: "高危蔬菜二刷！" });
        });
      }
      else if (lvId === 9) {
        // Level 9: 个人错题大清零
        const mEntries = shuffle(Object.values(state.mistakes));
        if (mEntries.length > 0) {
          mEntries.forEach(m => {
            if (m.kind === "word") {
              const w = VOCAB.find(x => x.id === m.id);
              if (w) steps.push({ kind: "word_spell", word: w, tagNl: "Fouten-EHBO · Woord", tagZh: "错题清零 · 拼写" });
            } else if (m.kind === "grammar") {
              const q = GRAMMAR_QUESTIONS.find(x => x.id === m.id);
              if (q) steps.push({ kind: "grammar", q, tagNl: "Fouten-EHBO · Grammatica", tagZh: "错题清零 · 语法" });
            } else if (m.kind === "sb") {
              const sb = SENTENCE_BUILDS.find(x => x.id === m.id);
              if (sb) steps.push({ kind: "sentence_build", sb, tagNl: "Fouten-EHBO · Zin Bouwen", tagZh: "错题清零 · 拼句" });
            }
          });
        } else {
          // 零错题奖励：6 道考前黄金保底热身
          ["w16", "w35", "w38"].forEach(id => steps.push({ kind: "word_spell", word: VOCAB.find(x => x.id === id), tagNl: "Topper-Check · Groente", tagZh: "考前保底 · 蔬菜" }));
          ["g3_3", "g3_9", "g2_3"].forEach(id => steps.push({ kind: "grammar", q: GRAMMAR_QUESTIONS.find(x => x.id === id), tagNl: "Topper-Check · Grammatica", tagZh: "考前保底 · 语法" }));
        }
      }
      else if (lvId === 10) {
        // Level 10: 24 题终极模拟考（不重考，真实计分出 Cijfer！）
        shuffle(VEG_WORDS).slice(0, 6).forEach(w => steps.push({ kind: "word_spell", word: w, tagNl: "Eindtoets · Deel A Groente", tagZh: "模拟考 · A 蔬菜拼写" }));
        shuffle(NON_VEG_WORDS).slice(0, 6).forEach(w => steps.push({ kind: "word_spell", word: w, tagNl: "Eindtoets · Deel B Woorden", tagZh: "模拟考 · B 综合词汇" }));
        const g1 = shuffle(GRAMMAR_QUESTIONS.filter(q => q.group === "g1")).slice(0, 2);
        const g2 = shuffle(GRAMMAR_QUESTIONS.filter(q => q.group === "g2")).slice(0, 2);
        const g3 = shuffle(GRAMMAR_QUESTIONS.filter(q => q.group === "g3")).slice(0, 6);
        const ph = shuffle(GRAMMAR_QUESTIONS.filter(q => q.group === "phrases")).slice(0, 2);
        [...g1, ...g2, ...g3, ...ph].forEach(q => steps.push({ kind: "grammar", q, tagNl: "Eindtoets · Deel C Grammatica", tagZh: "模拟考 · C 语法与句型" }));
      }

      return steps;
    }

    // =====================================================
    // 6. 全屏多邻国闯关引擎
    // =====================================================
    function startLevel(lvId) {
      const steps = buildLevelSteps(lvId);
      lesson = {
        active: true,
        lvId,
        isExam: lvId === 10,
        queue: steps,
        totalBase: steps.length,
        doneCount: 0,
        firstTryRight: 0,
        examErrors: [],
        selected: null,
        sbPicked: [],    // indices into step._bank
        checked: false,
        lastOk: false,
        lastFbTitle: "",
        lastFbDetail: "",
        hintShown: false,
        matchState: null,
        labTime: "today",
        labPerson: "she",
        labSpeech: ""
      };
      document.getElementById("map-shell").classList.add("hidden");
      document.getElementById("lesson-shell").classList.add("active");
      renderCurrentStep();
    }

    function exitLesson() {
      lesson = null;
      document.getElementById("lesson-shell").classList.remove("active");
      document.getElementById("map-shell").classList.remove("hidden");
      renderMap();
    }

    function renderCurrentStep() {
      if (!lesson) return;
      if (lesson.queue.length === 0) { renderVictoryScreen(); return; }

      const step = lesson.queue[0];
      const pct = Math.min(100, Math.round((lesson.doneCount / (lesson.doneCount + lesson.queue.length)) * 100));
      document.getElementById("duo-bar-fill").style.width = `${pct}%`;
      document.getElementById("lesson-counter").textContent = `${lesson.doneCount + 1} / ${lesson.doneCount + lesson.queue.length}`;

      const body = document.getElementById("lesson-body");
      const badgeHtml = `<div class="step-badge ${step.isRetry ? "retry" : ""}">
        ${step.isRetry ? `🔁 ${t("Oefen nog een keer", "错题再练一次")}` : `✨ ${t(step.tagNl, step.tagZh)}`}
      </div>`;

      if (step.kind === "match") {
        if (!lesson.matchState || lesson.matchState.stepRef !== step) {
          lesson.matchState = { stepRef: step, left: shuffle(step.words), right: shuffle(step.words), selL: null, selR: null, matched: {}, lastTip: "" };
        }
        const ms = lesson.matchState;
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">${tBlock("Koppel Nederlands aan Engels!", "把荷兰语和对应的英语连连看配对！")}</h2>
          <p class="q-sub">${ms.lastTip ? `💡 ${ms.lastTip}` : tBlock("Klik eerst links, daarna het goede woord rechts.", "先点左边荷兰语，再点右边对应的英文。")}</p>
          <div class="match-cols">
            <div class="match-col">
              ${ms.left.map(w => `<button class="match-tile ${ms.matched[w.id] ? "matched" : (ms.selL === w.id ? "selected" : "")}" onclick="pickMatch('L','${w.id}')">${w.emoji} ${w.nl}${state.lang !== "nl" ? `<span class="bilingual-zh">${w.zh}</span>` : ""}</button>`).join("")}
            </div>
            <div class="match-col">
              ${ms.right.map(w => `<button class="match-tile ${ms.matched[w.id] ? "matched" : (ms.selR === w.id ? "selected" : "")}" onclick="pickMatch('R','${w.id}')">${w.en}</button>`).join("")}
            </div>
          </div>`;
        renderFooter();
      }
      else if (step.kind === "word_choice") {
        const w = step.word;
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">${w.emoji} ${tBlock(`Wat is '${w.nl}' in het Engels?`, `“${w.nl}”的英语是哪一个？`)}</h2>
          <p class="q-sub">${state.lang !== "nl" ? `🇨🇳 ${w.zh} · ` : ""}<button class="icon-btn" onclick="speakEn('${w.en}')">🔊 ${t("Luister", "听发音")}</button></p>
          <div class="choice-grid">
            ${step.options.map((o, i) => {
              let cls = "";
              if (lesson.checked) { if (o.id === w.id) cls = "correct"; else if (lesson.selected === o.id) cls = "wrong"; }
              else if (lesson.selected === o.id) cls = "selected";
              return `<button class="choice-tile ${cls}" ${lesson.checked ? "disabled" : ""} onclick="selectChoice('${o.id}', '${o.en}')"><span class="tile-num">${i + 1}</span><span>${o.en}</span></button>`;
            }).join("")}
          </div>`;
        renderFooter();
      }
      else if (step.kind === "word_spell") {
        const w = step.word;
        const masked = w.en.split(" ").map(p => p[0] + "_".repeat(Math.max(0, p.length - 1))).join("  ");
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">${tBlock("Typ het goede Engelse woord:", "请拼出正确的英语单词：")}</h2>
          <div class="spell-card">
            <div>
              <div style="font-size:1.45rem; font-weight:900;">${w.emoji} 🇳🇱 ${w.nl}</div>
              ${state.lang !== "nl" ? `<div style="color:var(--muted); font-weight:700;">🇨🇳 ${w.zh}</div>` : ""}
            </div>
            <div style="display:flex; gap:8px;">
              <button class="icon-btn" onclick="speakEn('${w.en}')">🔊 ${t("Luister", "听发音")}</button>
              ${!lesson.isExam ? `<button class="icon-btn" onclick="showSpellHint()">💡 ${t("Tip", "提示")}</button>` : ""}
            </div>
          </div>
          ${lesson.hintShown ? `<div style="color:var(--orange-dark); font-weight:800; margin-bottom:10px; font-size:0.92rem;">💡 ${masked}${w.tipNl ? ` — ${state.lang === "zh" ? w.tipZh : w.tipNl}` : ""}</div>` : ""}
          <input type="text" class="spell-input" id="duo-spell-input" autocomplete="off" spellcheck="false"
            value="${escapeHtml(lesson.selected || "")}" ${lesson.checked ? "disabled" : ""}
            placeholder="${t("Typ het Engelse woord...", "输入英文单词，按回车提交...")}" />`;
        renderFooter();
        const inp = document.getElementById("duo-spell-input");
        if (inp && !lesson.checked) {
          inp.focus();
          inp.addEventListener("input", e => {
            lesson.selected = e.target.value;
            const b = document.getElementById("btn-check-step");
            if (b) b.disabled = !lesson.selected.trim();
          });
        }
      }
      else if (step.kind === "sentence_build") {
        const sb = step.sb;
        if (!step._bank) step._bank = shuffle([...sb.target, ...sb.distractors]);
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🧩 ${tBlock("Bouw de goede Engelse zin:", "点击词块，拼出正确的英语句子：")}</h2>
          <p class="q-sub">🇳🇱 <strong>${escapeHtml(sb.promptNl)}</strong>${state.lang !== "nl" ? `<span class="bilingual-zh">🇨🇳 ${escapeHtml(sb.promptZh)}</span>` : ""}</p>
          <div class="sentence-slot ${lesson.sbPicked.length ? "has-words" : ""}">
            ${lesson.sbPicked.length === 0
              ? `<span style="color:#94a3b8; font-weight:700; font-size:0.92rem;">${t("Klik hieronder op de woorden in de goede volgorde (let op: er zitten instinkers bij!)", "按顺序点击下方词块拼成句子（注意：里面混了 1–2 个陷阱干扰词！）")}</span>`
              : lesson.sbPicked.map((bi, pos) => `<button class="wb-chip placed" ${lesson.checked ? "disabled" : ""} onclick="unpickWord(${pos})">${escapeHtml(step._bank[bi])}</button>`).join("")}
          </div>
          <div class="word-bank">
            ${step._bank.map((word, bi) => {
              const used = lesson.sbPicked.includes(bi);
              return `<button class="wb-chip ${used ? "used" : ""}" ${lesson.checked ? "disabled" : ""} onclick="pickWord(${bi})">${escapeHtml(word)}</button>`;
            }).join("")}
          </div>`;
        renderFooter();
      }
      else if (step.kind === "teach_veg") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🥦 ${tBlock("9 Groente-ezelsbruggetjes (even bekijken vóór je start!)", "开战前先看 1 分钟：9 个蔬菜「秒记秘籍」")}</h2>
          <p class="q-sub">${tBlock("Klik op 🔊 om te luisteren, en bekijk de ezelsbruggetjes!", "点 🔊 听英式发音，顺便记住拆词小口诀，待会儿配对和拼写就稳了！")}</p>
          <div class="veg-mini-grid">
            ${VEG_WORDS.map(w => `
              <div class="veg-mini-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <strong>${w.emoji} ${w.en}</strong>
                  <button class="icon-btn" onclick="speakEn('${w.en}')">🔊</button>
                </div>
                <div style="color:var(--blue-dark); font-weight:800;">🇳🇱 ${w.nl}${state.lang !== "nl" ? ` <span style="color:var(--muted); font-weight:600;">(${w.zh})</span>` : ""}</div>
                <div style="margin-top:4px; color:#334155; font-size:0.8rem;">💡 ${tBlock(w.tipNl, w.tipZh)}</div>
              </div>
            `).join("")}
          </div>`;
        lesson.checked = true; lesson.lastOk = true;
        renderFooter();
      }
      else if (step.kind === "teach_g12") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🍽️ ${tBlock("Grammatica 1 & 2: Beleefd bestellen & Eten", "课前秘籍：Grammatica 1（礼貌点餐）& 2（三餐搭配）")}</h2>
          <div class="teach-card">
            <div style="margin-bottom:14px;">
              <strong style="color:#1e40af;">1️⃣ Grammatica 1: 'would like' (${t("beleefd vragen & bestellen", "礼貌点餐想要")})</strong>
              <ul style="margin:6px 0 0; padding-left:18px; font-size:0.92rem;">
                <li><strong>What would you like</strong> to have / drink? <button class="icon-btn" onclick="speakEn('What would you like to have for lunch?')">🔊</button></li>
                <li><strong>Would you like</strong> a sandwich? — <strong>Yes, please.</strong> / <strong>No, thank you.</strong></li>
                <li><strong>I would like</strong> a salad. / <strong>I'd like</strong> orange juice, please.</li>
                <li>💡 ${tBlock("'I like' = vind ik lekker (altijd). 'I would like / I'd like' = wil ik graag (nu bestellen)!", "I like 是平时喜欢；I would like / I'd like 才是现在点餐想要！")}</li>
              </ul>
            </div>
            <div style="border-top:2px dashed #cbd5e1; padding-top:12px;">
              <strong style="color:#c2410c;">2️⃣ Grammatica 2: 'have' bij breakfast / lunch / dinner</strong>
              <ul style="margin:6px 0 0; padding-left:18px; font-size:0.92rem;">
                <li>💡 ${tBlock("In het Engels gebruik je bij ontbijt/lunch normaal 'have' (niet eat/make)!", "英语说吃早/午/晚饭固定用 have（不用 eat/make），介词用 FOR！")}</li>
                <li><strong>To have breakfast</strong> = ontbijten <button class="icon-btn" onclick="speakEn('What do you normally have for breakfast?')">🔊</button></li>
                <li>What do you normally <strong>have for</strong> breakfast? — We only <strong>have</strong> a sandwich <strong>for</strong> lunch.</li>
              </ul>
            </div>
          </div>`;
        lesson.checked = true; lesson.lastOk = true;
        renderFooter();
      }
      else if (step.kind === "teach_l5") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🇬🇧 ${tBlock("Lesson 5: Phrases & Sunday Roast", "课前秘籍：Lesson 5 必背句型 & 英国 Sunday Roast")}</h2>
          <div class="teach-card">
            <div style="margin-bottom:14px;">
              <strong style="color:#1e40af;">💬 Phrases to know</strong>
              <ul style="margin:6px 0 0; padding-left:18px; font-size:0.92rem;">
                <li><strong>What would you like (to have)?</strong> = Wat wil je hebben? <button class="icon-btn" onclick="speakEn('What would you like to have?')">🔊</button></li>
                <li><strong>I would like an orange juice.</strong> = Ik wil graag sinaasappelsap.</li>
                <li><strong>To have breakfast</strong> = ontbijten</li>
              </ul>
            </div>
            <div style="border-top:2px dashed #cbd5e1; padding-top:12px;">
              <strong style="color:#15803d;">🍖 Nice to know: Sunday roast</strong>
              <p style="margin:6px 0 0; font-size:0.9rem; line-height:1.5;">
                ${tBlock(
                  "Veel gezinnen in het VK eten op zondag een traditionele 'Sunday roast': gebraden vlees (chicken, turkey, lamb, pork of beef) met roast potatoes, groente, gravy (jus) en soms stuffing en Yorkshire puddings.",
                  "很多英国家庭每周日会吃传统大餐 Sunday roast：烤肉（鸡、火鸡、羊、猪或牛肉）配烤土豆（roast potatoes）、蔬菜、肉汁（gravy），有时还有 stuffing 和约克郡布丁（Yorkshire puddings）。"
                )}
              </p>
            </div>
          </div>`;
        lesson.checked = true; lesson.lastOk = true;
        renderFooter();
      }
      else if (step.kind === "teach_ddd") {
        const isPast = lesson.labTime === "yesterday";
        const isSTeam = ["he", "she", "it"].includes(lesson.labPerson);
        const aux = isPast ? "Did" : (isSTeam ? "Does" : "Do");
        const auxLow = aux.toLowerCase();
        const auxNeg = isPast ? "didn't" : (isSTeam ? "doesn't" : "don't");
        const auxPill = isPast ? "pill-did" : (isSTeam ? "pill-does" : "pill-do");
        const ansSubj = lesson.labPerson === "you" ? "I" : lesson.labPerson;
        const tail = isPast ? " yesterday" : "";
        lesson.labSpeech = `${aux} ${lesson.labPerson} like spinach${tail}? Yes, ${ansSubj} ${auxLow}. No, ${ansSubj} ${auxNeg}.`;

        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">⏰ ${tBlock("De 3 Super-Trucs voor Do / Does / Did", "先花 30 秒玩懂 Do / Does / Did 三个超级口诀")}</h2>
          <div class="teach-card">
            <div style="font-size:0.9rem; margin-bottom:10px;">
              <strong>1. ⏰ ${t("Tijdmachine + S-team", "先看时间机，再看 S 小队")}</strong>:
              <span class="pill pill-did">Yesterday → Did</span>
              <span class="pill pill-does">Today + he/she/it → DoeS</span>
              <span class="pill pill-do">Today + I/you/we → Do</span>
            </div>
            <div style="font-size:0.9rem; margin-bottom:10px;">
              <strong>2. 🎒 ${t("Rugzak-regel", "背包法则")}</strong>:
              ${tBlock("Does/Did dragen de -s of verleden tijd al → 'like' blijft altijd kaal!", "Does/Did 已经背走变化，问句里的 like 永远保持原形！")}
              <span class="pill pill-bare">✅ Did she like?</span>
              <span class="pill pill-err">❌ Did she liked?</span>
            </div>
            <div style="font-size:0.9rem; margin-bottom:14px;">
              <strong>3. 🪞 ${t("Spiegel-regel", "镜子法则")}</strong>:
              ${tBlock("Vraag met Does → Yes, ... does / No, ... doesn't. Vraag met Did → did / didn't.", "问句用什么开头，简短回答就照镜子回什么！")}
            </div>
            <div style="border-top:2px dashed #cbd5e1; padding-top:12px;">
              <div style="font-weight:900; font-size:0.88rem; color:#5b21b6;">🎛️ ${t("Probeer de Tijdmachine zelf (klik op de knoppen):", "动手点点时间机，看句子怎么变：")}</div>
              <div class="mini-switch">
                <button class="${!isPast ? "active" : ""}" onclick="setLessonLab('time','today')">☀️ Today</button>
                <button class="${isPast ? "active" : ""}" onclick="setLessonLab('time','yesterday')">⏪ Yesterday</button>
                <span style="width:8px;"></span>
                ${["you","we","he","she","it"].map(p => `<button class="${lesson.labPerson === p ? "active" : ""}" onclick="setLessonLab('person','${p}')">${p}${["he","she","it"].includes(p) ? " (S)" : ""}</button>`).join("")}
              </div>
              <div style="background:#fff; border:2px solid #e2e8f0; border-radius:14px; padding:12px 14px; margin-top:8px;">
                <div style="font-size:1.22rem; font-weight:900;">
                  ❓ <span class="pill ${auxPill}">${aux}</span> ${lesson.labPerson} <span class="pill pill-bare">like</span> spinach${tail}?
                  <button class="icon-btn" style="float:right;" onclick="speakEn(lesson.labSpeech)">🔊</button>
                </div>
                <div style="margin-top:8px; font-weight:800; font-size:0.95rem;">
                  🪞 <span style="color:#166534;">Yes, ${ansSubj} ${auxLow}.</span> &nbsp;|&nbsp;
                  <span style="color:#991b1b;">No, ${ansSubj} ${auxNeg}.</span>
                </div>
              </div>
              <table class="mini-table">
                <tr><th>${t("Tijd", "时间")}</th><th>I / you / we</th><th>he / she / it (S-team)</th></tr>
                <tr><td><strong>☀️ Today</strong></td><td><strong>Do</strong> / don't</td><td><strong>Does</strong> / doesn't</td></tr>
                <tr><td><strong>⏪ Yesterday</strong></td><td><strong>Did</strong> / didn't</td><td><strong>Did</strong> / didn't</td></tr>
              </table>
            </div>
          </div>`;
        lesson.checked = true; lesson.lastOk = true;
        renderFooter();
      }
      else if (step.kind === "flits") {
        const f = step.flits;
        let cluesHtml = "", opts = [], titleHtml = "";
        if (f.mode === "aux") {
          titleHtml = tBlock("Welk woord begint de vraag?", "这句问句开头选哪一个？");
          cluesHtml = `<div class="clue-row"><span class="clue-pill ${f.time === "yesterday" ? "past" : "today"}">${f.time === "yesterday" ? "⏪ Yesterday" : "☀️ Today"}</span><span class="clue-pill person">${f.person}</span></div>`;
          opts = f.opts.map(o => ({ val: o, label: o }));
        } else if (f.mode === "mirror") {
          titleHtml = `🪞 ${tBlock("Spiegel-regel: Maak het korte antwoord af!", "镜子法则：选出正确的简短回答！")}`;
          cluesHtml = `<div class="clue-row"><span class="clue-pill today">${escapeHtml(f.q)}</span><span class="clue-pill person">${escapeHtml(f.yn)}</span></div>`;
          opts = f.opts.map(o => ({ val: o, label: o }));
        } else {
          titleHtml = `🎒 ${tBlock("Rugzak-check: Is deze zin GOED of FOUT?", "背包找茬：这句话是对还是超载错了？")}`;
          cluesHtml = `<div class="clue-row"><span class="clue-pill past">"${escapeHtml(f.sentence)}"</span></div>`;
          opts = [{ val: "OK", label: `✅ ${t("Helemaal GOED", "完全正确")}` }, { val: "BUG", label: `🎒 ${t("FOUT! Dubbel!", "错了！背包超载！")}` }];
        }
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">${titleHtml}</h2>
          ${cluesHtml}
          <div class="choice-grid">
            ${opts.map((o, i) => {
              let cls = "";
              if (lesson.checked) { if (o.val === f.answer) cls = "correct"; else if (lesson.selected === o.val) cls = "wrong"; }
              else if (lesson.selected === o.val) cls = "selected";
              return `<button class="choice-tile ${cls}" ${lesson.checked ? "disabled" : ""} onclick="selectChoice(${JSON.stringify(o.val).replace(/"/g, '&quot;')})"><span class="tile-num">${i + 1}</span><span>${escapeHtml(o.label)}</span></button>`;
            }).join("")}
          </div>`;
        renderFooter();
      }
      else if (step.kind === "grammar") {
        const q = step.q;
        const promptHtml = q.promptNl === q.promptZh ? escapeHtml(q.promptNl) : tBlock(q.promptNl, q.promptZh);
        if (q.type === "choice") {
          if (!step._opts) step._opts = shuffle(q.options);
          body.innerHTML = `
            ${badgeHtml}
            <h2 class="q-title">${promptHtml}</h2>
            <p class="q-sub">${tBlock(q.subNl, q.subZh)}</p>
            <div class="choice-grid ${step._opts.some(x => x.length > 26) ? "single-col" : ""}">
              ${step._opts.map((o, i) => {
                let cls = "";
                if (lesson.checked) { if (o === q.answer) cls = "correct"; else if (lesson.selected === o) cls = "wrong"; }
                else if (lesson.selected === o) cls = "selected";
                return `<button class="choice-tile ${cls}" ${lesson.checked ? "disabled" : ""} onclick="selectChoice(${JSON.stringify(o).replace(/"/g, '&quot;')})"><span class="tile-num">${i + 1}</span><span>${escapeHtml(o)}</span></button>`;
              }).join("")}
            </div>`;
          renderFooter();
        } else {
          body.innerHTML = `
            ${badgeHtml}
            <h2 class="q-title">${promptHtml}</h2>
            <p class="q-sub">${tBlock(q.subNl, q.subZh)}</p>
            <input type="text" class="spell-input" id="duo-spell-input" autocomplete="off" spellcheck="false"
              value="${escapeHtml(lesson.selected || "")}" ${lesson.checked ? "disabled" : ""}
              placeholder="${t("Typ 1 Engels woord...", "填入空缺的 1 个英文词...")}" />`;
          renderFooter();
          const inp = document.getElementById("duo-spell-input");
          if (inp && !lesson.checked) {
            inp.focus();
            inp.addEventListener("input", e => {
              lesson.selected = e.target.value;
              const b = document.getElementById("btn-check-step");
              if (b) b.disabled = !lesson.selected.trim();
            });
          }
        }
      }
    }

    function setLessonLab(key, val) { if (key === "time") lesson.labTime = val; else lesson.labPerson = val; renderCurrentStep(); }
    function showSpellHint() { lesson.hintShown = true; renderCurrentStep(); }
    function selectChoice(val, speakText) { if (lesson.checked) return; lesson.selected = val; if (speakText) speakEn(speakText); renderCurrentStep(); }
    function pickWord(bi) { if (lesson.checked || lesson.sbPicked.includes(bi)) return; lesson.sbPicked.push(bi); renderCurrentStep(); }
    function unpickWord(pos) { if (lesson.checked) return; lesson.sbPicked.splice(pos, 1); renderCurrentStep(); }

    function pickMatch(side, id) {
      const ms = lesson.matchState;
      if (!ms || ms.matched[id]) return;
      if (side === "L") ms.selL = id;
      else { ms.selR = id; const w = VOCAB.find(x => x.id === id); if (w) speakEn(w.en); }
      if (ms.selL && ms.selR) {
        if (ms.selL === ms.selR) {
          const w = VOCAB.find(x => x.id === ms.selL);
          ms.matched[ms.selL] = true; ms.selL = null; ms.selR = null;
          state.xp += 2; if (w) state.mastered[w.id] = true;
          playTone("ok");
          ms.lastTip = w && w.tipNl ? `${w.en} = ${w.nl} (${state.lang === "zh" ? w.tipZh : w.tipNl})` : `✅ ${w.en} = ${w.nl}`;
          saveState();
          if (Object.keys(ms.matched).length === ms.left.length) {
            lesson.checked = true; lesson.lastOk = true;
            lesson.lastFbTitle = t("Alle paren gevonden! 🎉", "全部配对成功！🎉"); lesson.lastFbDetail = "";
          }
        } else {
          playTone("err"); ms.selL = null; ms.selR = null;
          ms.lastTip = t("Oeps, niet het juiste paar! Probeer nog eens.", "这两个不是一对，再试试！");
        }
      }
      renderCurrentStep();
    }

    function renderFooter() {
      const footer = document.getElementById("lesson-footer");
      const inner = document.getElementById("footer-inner");
      const step = lesson.queue[0];

      if (step.kind.startsWith("teach_")) {
        footer.className = "lesson-footer";
        const msg = step.kind === "teach_ddd"
          ? t("Snap je de Tijdmachine, Rugzak en Spiegel? Starten maar!", "看懂时间机、背包和镜子法则了吗？开始挑战！")
          : t("Alles duidelijk? Dan beginnen we met de oefeningen!", "看明白口诀了吗？现在开始闯关！");
        inner.innerHTML = `<div class="fb-text"><div class="fb-detail">🚀 ${msg}</div></div>
          <button class="duo-btn purple" onclick="nextStep()">${t("IK SNAP HET! START →", "懂了！开始闯关 →")}</button>`;
        return;
      }
      if (step.kind === "match" && !lesson.checked) {
        footer.className = "lesson-footer";
        const leftCnt = lesson.matchState.left.length - Object.keys(lesson.matchState.matched).length;
        inner.innerHTML = `<div class="fb-text"><div class="fb-detail">🧩 ${t(`Nog ${leftCnt} paren te koppelen...`, `还剩 ${leftCnt} 组待配对...`)}</div></div>`;
        return;
      }
      if (!lesson.checked) {
        footer.className = "lesson-footer";
        const canCheck = step.kind === "sentence_build"
          ? lesson.sbPicked.length > 0
          : (lesson.selected !== null && String(lesson.selected).trim().length > 0);
        inner.innerHTML = `<div class="fb-text"></div>
          <button class="duo-btn" id="btn-check-step" ${canCheck ? "" : "disabled"} onclick="checkCurrentStep()">${t("CONTROLEER", "检查答案")}</button>`;
      } else {
        footer.className = `lesson-footer ${lesson.lastOk ? "ok" : "err"}`;
        inner.innerHTML = `
          <div class="fb-text">
            <div class="fb-title">${lesson.lastOk ? "✅" : "❌"} ${lesson.lastFbTitle}</div>
            <div class="fb-detail">${lesson.lastFbDetail}</div>
          </div>
          <button class="duo-btn ${lesson.lastOk ? "" : "red"}" onclick="nextStep()">${t("GA DOOR", "下一题")} →</button>`;
      }
    }

    function checkCurrentStep() {
      if (!lesson || lesson.checked) return;
      const step = lesson.queue[0];
      lesson.checked = true;
      let ok = false, fbTitle = "", fbDetail = "";

      if (step.kind === "word_choice") {
        const w = step.word;
        ok = lesson.selected === w.id;
        speakEn(w.en);
        if (ok) {
          fbTitle = t("Supergoed!", "太棒了！");
          fbDetail = `${w.en} = ${w.nl}${w.tipNl ? ` · 💡 ${state.lang === "zh" ? w.tipZh : w.tipNl}` : ""}`;
          handleRecord(true, "word", w.id, step);
        } else {
          fbTitle = t(`Goede antwoord: ${w.en}`, `正确答案：${w.en}`);
          fbDetail = w.tipNl ? `💡 ${tBlock(w.tipNl, w.tipZh)}` : `${w.en} = ${w.nl}`;
          handleRecord(false, "word", w.id, step, `${w.nl} → ${w.en}`);
        }
      }
      else if (step.kind === "word_spell") {
        const w = step.word;
        const typed = String(lesson.selected || "");
        ok = normalizeAns(typed) === normalizeAns(w.en);
        speakEn(w.en);
        if (ok) {
          fbTitle = t("Helemaal goed gespeld!", "拼写完美！");
          fbDetail = `${w.en} = ${w.nl}`;
          handleRecord(true, "word", w.id, step);
        } else {
          fbTitle = t(`Goede spelling: ${w.en}`, `正确拼写：${w.en}`);
          fbDetail = `${renderLetterDiff(typed, w.en)}${w.tipNl ? `<div style="margin-top:4px;">💡 ${tBlock(w.tipNl, w.tipZh)}</div>` : ""}`;
          handleRecord(false, "word", w.id, step, `${w.nl} → ${w.en}`);
        }
      }
      else if (step.kind === "sentence_build") {
        const sb = step.sb;
        const pickedWords = lesson.sbPicked.map(bi => step._bank[bi]);
        const built = pickedWords.join(" ");
        const expected = sb.target.join(" ");
        ok = built === expected;
        speakEn(expected);
        if (ok) {
          fbTitle = t("Perfecte zin gebouwd!", "拼句完美！");
          fbDetail = `<div class="fb-why">💡 ${tBlock(sb.explainNl, sb.explainZh)}</div>`;
          handleRecord(true, "sb", sb.id, step);
        } else {
          fbTitle = t(`Goede zin: ${expected}`, `正确句子：${expected}`);
          const usedTraps = pickedWords.filter(w => sb.trapNl && sb.trapNl[w]);
          let trapMsg = "";
          if (usedTraps.length > 0) {
            trapMsg = usedTraps.map(tw =>
              `<div class="fb-why">❌ <strong>${escapeHtml(tw)}</strong>: ${tBlock(sb.trapNl[tw], sb.trapZh[tw])}</div>`
            ).join("");
          } else {
            trapMsg = `<div class="fb-why">⚠️ ${tBlock("Let goed op de woordvolgorde!", "注意单词排列顺序哦！")}</div>`;
          }
          fbDetail = `${trapMsg}<div style="margin-top:5px;">💡 ${tBlock(sb.explainNl, sb.explainZh)}</div>`;
          handleRecord(false, "sb", sb.id, step, `${sb.promptNl} → ${expected}`);
        }
      }
      else if (step.kind === "flits") {
        const f = step.flits;
        ok = lesson.selected === f.answer;
        if (ok) {
          fbTitle = t("Supersnel goed!", "闪电答对！");
          fbDetail = `<div class="fb-why">💡 ${tBlock(f.exNl, f.exZh)}</div>`;
          state.xp += 10; state.streak += 1; if (!step.isRetry) lesson.firstTryRight++;
          playTone("ok"); saveState();
        } else {
          fbTitle = t("Bijna! Kijk waarom:", "差一点，看看原因：");
          const wNl = f.wrongNl && f.wrongNl[lesson.selected];
          const wZh = f.wrongZh && f.wrongZh[lesson.selected];
          const whyHtml = wNl ? `<div class="fb-why">❌ ${tBlock(wNl, wZh)}</div>` : "";
          fbDetail = `${whyHtml}<div style="margin-top:5px;">💡 ${tBlock(f.exNl, f.exZh)}</div>`;
          state.streak = 0; playTone("err"); saveState();
          lesson.queue.push({ ...step, isRetry: true });
        }
      }
      else if (step.kind === "grammar") {
        const q = step.q;
        ok = normalizeAns(lesson.selected) === normalizeAns(q.answer);
        if (ok) {
          fbTitle = t("Top! Helemaal goed!", "完全正确！");
          fbDetail = `<div class="fb-why">💡 ${tBlock(q.explainNl, q.explainZh)}</div>`;
          handleRecord(true, "grammar", q.id, step);
        } else {
          fbTitle = t(`Goede antwoord: ${q.answer}`, `正确答案：${q.answer}`);
          let whyHtml = "";
          if (q.type === "choice" && q.wrongNl && q.wrongNl[lesson.selected]) {
            whyHtml = `<div class="fb-why">❌ <strong>${escapeHtml(lesson.selected)}</strong>: ${tBlock(q.wrongNl[lesson.selected], q.wrongZh[lesson.selected])}</div>`;
          } else if (q.type === "fill" && q.commonNl) {
            const normTyped = normalizeAns(lesson.selected);
            if (q.commonNl[normTyped]) {
              whyHtml = `<div class="fb-why">❌ <strong>${escapeHtml(lesson.selected)}</strong>: ${tBlock(q.commonNl[normTyped], q.commonZh[normTyped])}</div>`;
            }
          }
          fbDetail = `${whyHtml}<div style="margin-top:5px;">💡 ${tBlock(q.explainNl, q.explainZh)}</div>`;
          const errDetail = whyHtml
            ? `${q.promptNl} → ${q.answer} (${state.lang === "zh" ? (q.wrongZh?.[lesson.selected] || q.commonZh?.[normalizeAns(lesson.selected)] || q.explainZh) : (q.wrongNl?.[lesson.selected] || q.commonNl?.[normalizeAns(lesson.selected)] || q.explainNl)})`
            : `${q.promptNl} → ${q.answer} (${state.lang === "zh" ? q.explainZh : q.explainNl})`;
          handleRecord(false, "grammar", q.id, step, errDetail);
        }
      }

      lesson.lastOk = ok; lesson.lastFbTitle = fbTitle; lesson.lastFbDetail = fbDetail;
      renderCurrentStep();
    }

    function handleRecord(ok, kind, id, step, examSummary) {
      if (ok) {
        state.xp += 10; state.streak += 1;
        if (kind === "word") state.mastered[id] = true;
        delete state.mistakes[`${kind}:${id}`];
        if (!step.isRetry) lesson.firstTryRight++;
        playTone("ok");
      } else {
        state.streak = 0;
        state.mistakes[`${kind}:${id}`] = { kind, id };
        playTone("err");
        if (lesson.isExam) lesson.examErrors.push(examSummary);
        else lesson.queue.push({ ...step, isRetry: true });
      }
      saveState();
    }

    function nextStep() {
      if (!lesson) return;
      lesson.queue.shift();
      lesson.doneCount++;
      lesson.selected = null;
      lesson.sbPicked = [];
      lesson.checked = false;
      lesson.hintShown = false;
      lesson.matchState = null;
      renderCurrentStep();
    }

    function renderVictoryScreen() {
      playTone("win");
      const lvId = lesson.lvId;
      state.completedLevels[lvId] = true;
      const unlockedNew = lvId === state.unlockedLevel && lvId < 10;
      if (unlockedNew) state.unlockedLevel = lvId + 1;
      state.xp += 30;

      document.getElementById("duo-bar-fill").style.width = "100%";
      document.getElementById("lesson-counter").textContent = "✓";

      const body = document.getElementById("lesson-body");
      const footer = document.getElementById("lesson-footer");
      const inner = document.getElementById("footer-inner");
      footer.className = "lesson-footer ok";

      if (lesson.isExam) {
        const score = lesson.firstTryRight, total = lesson.totalBase;
        const cijfer = (1 + (score / total) * 9).toFixed(1);
        if (!state.bestCijfer || parseFloat(cijfer) > parseFloat(state.bestCijfer)) state.bestCijfer = cijfer;
        saveState();

        const msgNl = cijfer >= 8.5 ? "Wauw Ernst! Helemaal klaar voor morgen! 🌟"
          : (cijfer >= 7.0 ? "Knap gedaan! Werk je fouten weg in Level 9 voor een 10!" : "Goed geoefend! Ga even naar Level 9 (Fouten-EHBO) en doe de toets nog een keer!");
        const msgZh = cijfer >= 8.5 ? "太棒了 Ernst！明天稳拿高分！🌟"
          : (cijfer >= 7.0 ? "很不错！去第 9 关把错题清零就能冲满分！" : "错题已收进第 9 关急救包，清零后再考一次一定大涨分！");

        body.innerHTML = `
          <div class="victory-box">
            <h2 class="q-title">🏆 ${t("Eindtoets klaar!", "终极模拟考完成！")}</h2>
            <div class="cijfer-circle">${cijfer}<span>/ 10 Cijfer</span></div>
            <p class="q-sub" style="margin-bottom:8px;"><strong>${score} / ${total}</strong> ${t("goed", "题答对")} · ${t(msgNl, msgZh)}</p>
            ${lesson.examErrors.length ? `
              <div class="review-list">
                <strong style="color:#b91c1c;">🩹 ${t("Even terugkijken (staan nu in Level 9 Fouten-EHBO):", "本次错题速览（已存入第 9 关急救包）：")}</strong>
                ${lesson.examErrors.map(e => `<div class="review-item">❌ ${escapeHtml(e)}</div>`).join("")}
              </div>` : `<div style="color:#166534; font-weight:900; font-size:1.1rem; margin-top:10px;">✨ ${t("FOUTLOOS! Een echte 10!", "零失误满分 10 分！")}</div>`}
          </div>`;
        inner.innerHTML = `<div class="fb-text"><div class="fb-title">🎉 +30 XP</div></div>
          <button class="duo-btn" onclick="exitLesson()">${t("TERUG NAAR KAART", "返回闯关地图")}</button>`;
      } else {
        saveState();
        const nextLv = LEVELS.find(x => x.id === lvId + 1);
        body.innerHTML = `
          <div class="victory-box">
            <div style="font-size:4.2rem;">🏆✨</div>
            <h2 class="q-title">${t(`Level ${lvId} gehaald, Ernst!`, `第 ${lvId} 关通关成功！`)}</h2>
            <p class="q-sub">+30 XP · 🔥 ${t(`Reeks: ${state.streak}`, `当前连击：${state.streak}`)}</p>
            ${unlockedNew && nextLv ? `
              <div style="display:inline-block; background:var(--gold-soft); border:2px solid var(--gold); border-radius:16px; padding:12px 18px; font-weight:900; color:#854d0e; margin-top:8px;">
                🔓 ${t(`Nieuw level ontgrendeld: ${nextLv.icon} ${nextLv.titleNl}`, `已解锁下一关：${nextLv.icon} ${nextLv.titleZh}`)}
              </div>` : ""}
          </div>`;
        inner.innerHTML = `
          <div class="fb-text"><div class="fb-title">🌟 ${t("Goed bezig!", "升级成功！")}</div></div>
          <div style="display:flex; gap:10px;">
            <button class="duo-btn outline" onclick="exitLesson()">${t("KAART", "回地图")}</button>
            ${nextLv ? `<button class="duo-btn" onclick="startLevel(${nextLv.id})">${t(`LEVEL ${nextLv.id} →`, `进第 ${nextLv.id} 关 →`)}</button>` : ""}
          </div>`;
      }
    }

    function openGuide() {
      document.getElementById("guide-modal-title").textContent = t("📘 Ernst's Unit 2 Spiekbriefje (Alle Trucs)", "📘 Unit 2 考前秘籍手册（随时可看）");
      document.getElementById("btn-guide-close").textContent = t("TERUG NAAR OEFENEN", "关闭并继续");
      document.getElementById("guide-modal-body").innerHTML = `
        <div class="guide-sec">
          <h3>⏰ 1. Grammatica 3: Do / Does / Did — 3 Super-Trucs</h3>
          <p style="margin:4px 0; font-size:0.88rem;"><strong>⏰ ${t("Truc 1: Tijdmachine + S-team", "口诀 1：时间机 + S 小队")}</strong> — ${tBlock("Zie je Yesterday? Altijd Did / didn't (ook bij he/she/it!). Alleen bij Today krijgt het S-team (he/she/it) DoeS / doeSn't.", "看见 Yesterday 一律用 Did / didn't！只有 Today 遇到 S 小队（he/she/it）才用 Does / doesn't。")}</p>
          <p style="margin:4px 0; font-size:0.88rem;"><strong>🎒 ${t("Truc 2: Rugzak-regel", "口诀 2：大力士背包法则")}</strong> — ${tBlock("Does en Did dragen de -s of verleden tijd al! In een vraag blijft 'like' kaal (✅ Did she like? / ❌ Did she liked?). Zonder Did: Yesterday I liked.", "Does/Did 已经背走变化，问句里 like 永远用原形！没有 Did 的肯定句才变 Yesterday I liked。")}</p>
          <p style="margin:4px 0; font-size:0.88rem;"><strong>🪞 ${t("Truc 3: Spiegel-regel", "口诀 3：镜子法则")}</strong> — ${tBlock("Do → do/don't · Does → does/doesn't · Did → did/didn't.", "问句用什么开头，简短回答就照镜子回什么！")}</p>
          <table class="mini-table">
            <tr><th>${t("Tijd", "时间")}</th><th>I / you / we</th><th>he / she / it (S-team)</th></tr>
            <tr><td><strong>☀️ Today</strong></td><td>Do / don't</td><td><strong>Does / doesn't</strong></td></tr>
            <tr><td><strong>⏪ Yesterday</strong></td><td><strong>Did / didn't</strong></td><td><strong>Did / didn't</strong></td></tr>
          </table>
        </div>
        <div class="guide-sec">
          <h3>🍽️ 2. Grammatica 1 &amp; 2: 'would like' &amp; 'have'</h3>
          <p style="margin:4px 0; font-size:0.88rem;">• <strong>would like</strong>: What <strong>would you like</strong> to have? — <strong>I would like / I'd like</strong> a salad. (Yes, please. / No, thank you.)</p>
          <p style="margin:4px 0; font-size:0.88rem;">• <strong>have + maaltijd</strong>: <strong>To have breakfast</strong> = ontbijten. What do you normally <strong>have for</strong> lunch?</p>
        </div>
        <div class="guide-sec">
          <h3>🥦 3. 9 Groente-ezelsbruggetjes</h3>
          <div class="veg-mini-grid">
            ${VEG_WORDS.map(w => `<div class="veg-mini-card"><strong>${w.emoji} ${w.en}</strong> = ${w.nl}<br><small>💡 ${tBlock(w.tipNl, w.tipZh)}</small></div>`).join("")}
          </div>
        </div>
        <div class="guide-sec" style="margin-bottom:0;">
          <h3>🇬🇧 4. Sunday Roast (Lesson 5)</h3>
          <p style="margin:4px 0; font-size:0.88rem;">${tBlock("Traditionele zondagse maaltijd in het VK met gebraden vlees, roast potatoes, groente, gravy en soms stuffing en Yorkshire puddings.", "英国周日传统家庭聚餐：烤肉、烤土豆、蔬菜、肉汁（gravy），有时配 stuffing 和 Yorkshire puddings。")}</p>
        </div>`;
      document.getElementById("guide-modal").classList.add("open");
    }
    function closeGuide() { document.getElementById("guide-modal").classList.remove("open"); }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeGuide(); return; }
      if (document.getElementById("guide-modal").classList.contains("open")) return;
      if (!lesson || !lesson.active || e.key !== "Enter") return;
      const step = lesson.queue[0];
      if (!step) return;
      if (step.kind.startsWith("teach_")) { nextStep(); return; }
      if (step.kind === "match") { if (lesson.checked) nextStep(); return; }
      if (!lesson.checked) {
        const ready = step.kind === "sentence_build"
          ? lesson.sbPicked.length > 0
          : (lesson.selected !== null && String(lesson.selected).trim().length > 0);
        if (ready) checkCurrentStep();
      } else {
        nextStep();
      }
    });

    loadState();
    renderMap();
  </script>
</body>
</html>
