<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ernst Rekenen" />
  <meta name="theme-color" content="#1cb0f6" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231cb0f6'/%3E%3Ctext x='90' y='122' font-size='100' text-anchor='middle'%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E" />
  <title>Ernst's Rekenen · Breuken Quest (Groep 6)</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --green: #58cc02; --green-dark: #46a302; --green-soft: #e9fad9;
      --blue: #1cb0f6; --blue-dark: #0095db; --blue-soft: #e6f7ff;
      --purple: #ce82ff; --purple-dark: #9b51e0; --purple-soft: #f5ebff;
      --gold: #ffc800; --gold-dark: #e09f00; --gold-soft: #fff8d6;
      --orange: #ff9600; --orange-dark: #e07b00;
      --red: #ff4b4b; --red-dark: #d93636; --red-soft: #ffecec;
      --gray: #e5e5e5; --gray-dark: #afafaf;
      --text: #3c3c3c; --muted: #777777; --border: #e5e5e5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Nunito", "Segoe UI", "PingFang SC", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* TOPBAR */
    .topbar { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 2px solid var(--border); padding: 10px 16px; }
    .topbar-inner { max-width: 780px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .brand-mini { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.02rem; color: var(--blue-dark); }
    .back-home { text-decoration: none; border: 2px solid var(--border); border-radius: 10px; padding: 4px 9px; font-size: 0.82rem; font-weight: 800; color: var(--text); background: #fff; }
    .stats-row { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.88rem; }
    .stat-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #f1f5f9; }
    .controls-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lang-group { display: inline-flex; background: #f1f5f9; border-radius: 10px; padding: 2px; }
    .lang-btn { border: none; background: transparent; padding: 5px 9px; border-radius: 8px; font-size: 0.78rem; font-weight: 800; cursor: pointer; color: var(--muted); }
    .lang-btn.active { background: #fff; color: var(--blue-dark); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .icon-btn { border: 2px solid var(--border); background: #fff; border-radius: 10px; padding: 4px 9px; font-size: 0.8rem; font-weight: 800; cursor: pointer; color: var(--text); }
    .icon-btn.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }

    /* MAP */
    .map-container { max-width: 640px; margin: 20px auto 64px; padding: 0 16px; }
    .unit-banner { color: #fff; border-radius: 20px; padding: 16px 20px; margin: 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .unit-banner.sec1 { background: linear-gradient(135deg, #1cb0f6, #0095db); box-shadow: 0 5px 0 #0077b3; margin-top: 4px; }
    .unit-banner.sec2 { background: linear-gradient(135deg, #58cc02, #3cb300); box-shadow: 0 5px 0 var(--green-dark); }
    .unit-banner.sec3 { background: linear-gradient(135deg, #9333ea, #7c3aed); box-shadow: 0 5px 0 #5b21b6; }
    .unit-banner h2 { margin: 0; font-size: 1.12rem; }
    .unit-banner p { margin: 3px 0 0; font-size: 0.84rem; opacity: 0.95; }
    .unit-progress-pill { background: rgba(255,255,255,0.22); border-radius: 12px; padding: 6px 12px; font-weight: 900; font-size: 0.88rem; white-space: nowrap; }

    .path-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0 8px; }
    .path-step { display: flex; flex-direction: column; align-items: center; position: relative; }
    .path-connector { width: 6px; height: 18px; border-radius: 99px; background: var(--gray); }
    .path-connector.done { background: var(--green); }
    .node-row { display: flex; align-items: center; gap: 14px; }
    .node-btn {
      width: 80px; height: 74px; border-radius: 50%; border: none; font-size: 1.9rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; position: relative; transition: transform 0.12s; user-select: none;
    }
    .node-btn:active:not(:disabled) { transform: translateY(4px); }
    .node-btn.locked { background: var(--gray); box-shadow: 0 7px 0 #cfcfcf; color: #999; cursor: not-allowed; }
    .node-btn.current { background: var(--blue); box-shadow: 0 7px 0 var(--blue-dark); color: #fff; animation: gentlePulse 1.8s infinite; }
    .node-btn.current.boss { background: #9333ea; box-shadow: 0 7px 0 #6b21a8; }
    .node-btn.current.exam { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dark); }
    .node-btn.done { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dark); color: #fff; }
    .node-check {
      position: absolute; top: -4px; right: -4px; background: var(--green); color: #fff; border: 3px solid #fff;
      width: 26px; height: 26px; border-radius: 50%; font-size: 0.82rem; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .start-bubble {
      position: absolute; top: -34px; background: #fff; color: var(--blue-dark); border: 2px solid var(--border);
      border-radius: 12px; padding: 3px 12px; font-size: 0.76rem; font-weight: 900; letter-spacing: 0.6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08); white-space: nowrap; animation: floatY 1.6s ease-in-out infinite;
    }
    .node-label { margin-top: 9px; text-align: center; max-width: 260px; }
    .node-title { font-weight: 900; font-size: 0.94rem; color: var(--text); }
    .node-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .robot-buddy { font-size: 2.2rem; animation: floatY 2.2s ease-in-out infinite; }
    @keyframes gentlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .parent-bar {
      margin-top: 28px; padding: 12px 16px; background: #fff; border: 2px dashed var(--border); border-radius: 14px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.83rem; color: var(--muted);
    }

    /* FULLSCREEN LESSON */
    .lesson-shell { display: none; min-height: 100vh; flex-direction: column; background: #fff; }
    .lesson-shell.active { display: flex; }
    .map-shell.hidden { display: none; }
    .lesson-top { max-width: 720px; width: 100%; margin: 0 auto; padding: 18px 18px 10px; display: flex; align-items: center; gap: 14px; }
    .close-btn { border: none; background: transparent; font-size: 1.5rem; font-weight: 900; color: var(--gray-dark); cursor: pointer; padding: 4px 8px; border-radius: 10px; }
    .close-btn:hover { background: #f1f5f9; color: var(--text); }
    .duo-bar-track { flex: 1; height: 16px; background: var(--gray); border-radius: 999px; overflow: hidden; }
    .duo-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--blue), #58cc02); border-radius: 999px; transition: width 0.3s ease; }
    .lesson-counter { font-weight: 900; font-size: 0.9rem; color: var(--muted); min-width: 56px; text-align: right; }

    .lesson-body { flex: 1; max-width: 680px; width: 100%; margin: 0 auto; padding: 16px 20px 175px; display: flex; flex-direction: column; justify-content: center; }
    .step-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; color: var(--blue-dark); margin-bottom: 8px; }
    .step-badge.retry { color: var(--orange-dark); }
    .q-title { font-size: 1.38rem; font-weight: 900; margin: 0 0 8px; color: var(--text); line-height: 1.38; }
    .q-sub { font-size: 0.96rem; color: var(--muted); margin: 0 0 18px; }
    .bilingual-zh { display: block; font-size: 0.85em; font-weight: 600; color: #64748b; margin-top: 3px; }

    .duo-btn {
      border: none; border-radius: 16px; padding: 14px 26px; font-size: 1rem; font-weight: 900;
      cursor: pointer; transition: transform 0.1s; color: #fff; background: var(--green); box-shadow: 0 5px 0 var(--green-dark);
    }
    .duo-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--green-dark); }
    .duo-btn:disabled { background: var(--gray); box-shadow: 0 5px 0 #cfcfcf; color: #999; cursor: not-allowed; }
    .duo-btn.blue { background: var(--blue); box-shadow: 0 5px 0 var(--blue-dark); }
    .duo-btn.red { background: var(--red); box-shadow: 0 5px 0 var(--red-dark); }
    .duo-btn.outline { background: #fff; color: var(--text); border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }

    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
    @media (max-width: 520px) { .choice-grid { grid-template-columns: 1fr; } }
    .choice-tile {
      border: 2px solid var(--border); border-bottom-width: 5px; background: #fff; border-radius: 16px;
      padding: 15px 16px; font-size: 1.1rem; font-weight: 800; text-align: left; cursor: pointer;
      color: var(--text); transition: all 0.12s; display: flex; align-items: center; gap: 10px;
    }
    .choice-tile:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
    .choice-tile.selected { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }
    .choice-tile.correct { border-color: var(--green); background: var(--green-soft); color: #2b7000; }
    .choice-tile.wrong { border-color: var(--red); background: var(--red-soft); color: #a81c1c; }
    .tile-num { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 0.78rem; color: var(--muted); flex-shrink: 0; }

    .spell-input {
      width: 100%; padding: 15px 18px; font-size: 1.25rem; font-weight: 800;
      border: 2px solid #cbd5e1; border-bottom-width: 5px; border-radius: 16px; outline: none;
    }
    .spell-input:focus { border-color: var(--blue); background: #fcfeff; }

    /* Teach & Pizza Lab */
    .teach-card { border: 2px solid #e2e8f0; border-radius: 18px; padding: 18px; background: #fafcff; }
    .pizza-lab {
      display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
      background: #fff; border: 2px solid #bae6fd; border-radius: 16px; padding: 14px; margin-top: 10px;
    }
    .pizza-controls { flex: 1; min-width: 220px; }
    .mini-switch { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
    .mini-switch button { padding: 6px 11px; border-radius: 10px; border: 2px solid var(--border); background: #fff; font-weight: 800; cursor: pointer; }
    .mini-switch button.active { border-color: var(--blue-dark); background: var(--blue-soft); color: var(--blue-dark); }

    /* Footer */
    .lesson-footer { position: fixed; bottom: 0; left: 0; right: 0; border-top: 2px solid var(--border); background: #fff; padding: 14px 20px; z-index: 30; }
    .lesson-footer.ok { background: var(--green-soft); border-top-color: #b7eb8f; }
    .lesson-footer.err { background: var(--red-soft); border-top-color: #ffa39e; }
    .footer-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .fb-text { flex: 1; min-width: 220px; }
    .fb-title { font-size: 1.08rem; font-weight: 900; margin-bottom: 3px; }
    .lesson-footer.ok .fb-title { color: #2b7000; }
    .lesson-footer.err .fb-title { color: #b91c1c; }
    .fb-detail { font-size: 0.9rem; color: var(--text); font-weight: 600; }
    .fb-why {
      margin-top: 6px; padding: 7px 10px; border-radius: 10px;
      background: rgba(255,255,255,0.78); border-left: 4px solid var(--red);
      font-size: 0.86rem; line-height: 1.4;
    }
    .lesson-footer.ok .fb-why { border-left-color: var(--green); }

    /* Victory */
    .victory-box { text-align: center; padding: 16px 10px; }
    .cijfer-circle {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      width: 150px; height: 150px; border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #1cb0f6); color: #fff;
      font-size: 2.7rem; font-weight: 900; margin: 14px 0; box-shadow: 0 10px 26px rgba(28,176,246,0.28);
    }
    .cijfer-circle span { font-size: 0.85rem; font-weight: 700; }
    .review-list { text-align: left; margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .review-item { padding: 10px 14px; border-radius: 12px; border: 1.5px solid #fecaca; background: #fff5f5; font-size: 0.9rem; }

    /* Guide Modal */
    .guide-modal { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(15,23,42,0.55); padding: 16px; overflow-y: auto; align-items: flex-start; justify-content: center; }
    .guide-modal.open { display: flex; }
    .guide-sheet { background: #fff; border-radius: 22px; max-width: 720px; width: 100%; margin: 18px auto 36px; padding: 20px; box-shadow: 0 20px 48px rgba(15,23,42,0.25); }
    .guide-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid var(--border); margin-bottom: 14px; }
    .guide-sec { border: 2px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; background: #fafcff; }
    .guide-sec h3 { margin: 0 0 6px; font-size: 0.98rem; color: #0369a1; }
  </style>
</head>
<body>
  <div class="map-shell" id="map-shell">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand-mini">
          <a class="back-home" href="../../index.html">🏠</a>
          <span>🍕 <span id="brand-txt"></span></span>
        </div>
        <div class="stats-row">
          <span class="stat-chip">⚡ <span id="stat-xp">0</span> XP</span>
          <span class="stat-chip">🔥 <span id="stat-streak">0</span></span>
        </div>
        <div class="controls-row">
          <div class="lang-group">
            <button class="lang-btn active" id="lang-nl" onclick="setLang('nl')">🇳🇱 NL</button>
            <button class="lang-btn" id="lang-both" onclick="setLang('both')">🌐 NL+中</button>
            <button class="lang-btn" id="lang-zh" onclick="setLang('zh')">🇨🇳 中文</button>
          </div>
          <button class="icon-btn on" id="btn-sfx" onclick="toggleSfx()">🎵</button>
          <button class="icon-btn" id="btn-guide-map" onclick="openGuide()">📘</button>
          <button class="icon-btn" id="btn-cloud" onclick="openCloudSettings()">☁️</button>
        </div>
      </div>
    </div>

    <div class="map-container">
      <div id="map-sections"></div>
      <div class="parent-bar">
        <span id="parent-hint"></span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="icon-btn" id="btn-parent-mode" onclick="toggleParentMode()"></button>
          <button class="icon-btn" id="btn-reset" onclick="resetProgress()"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="lesson-shell" id="lesson-shell">
    <div class="lesson-top">
      <button class="close-btn" onclick="exitLesson()" title="Terug">✕</button>
      <div class="duo-bar-track"><div class="duo-bar-fill" id="duo-bar-fill"></div></div>
      <div class="lesson-counter" id="lesson-counter">1 / 10</div>
      <button class="icon-btn" id="btn-guide-lesson" onclick="openGuide()">📘</button>
    </div>
    <div class="lesson-body" id="lesson-body"></div>
    <div class="lesson-footer" id="lesson-footer"><div class="footer-inner" id="footer-inner"></div></div>
  </div>

  <div class="guide-modal" id="guide-modal" onclick="if(event.target===this) closeGuide()">
    <div class="guide-sheet">
      <div class="guide-head">
        <h2 id="guide-modal-title" style="margin:0; font-size:1.15rem;"></h2>
        <button class="close-btn" onclick="closeGuide()">✕</button>
      </div>
      <div id="guide-modal-body"></div>
      <div style="text-align:right; margin-top:12px;">
        <button class="duo-btn" onclick="closeGuide()" id="btn-guide-close">OK</button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================
    // 1. 数学分数题库：完全对应 Groep 6 Werkblad Niveau 1 (8大类) + 拓展变式
    // =====================================================
    const MATH_QUESTIONS = [
      // 1. Vereenvoudigen (约分)
      { id: "v1", cat: 1, type: "choice",
        promptNl: "Vereenvoudig de breuk 2/6 zo ver mogelijk.", promptZh: "把分数 2/6 约分到最简：",
        subNl: "Deel teller én noemer door hetzelfde getal!", subZh: "分子和分母同时除以同一个数！",
        options: ["1/3", "1/2", "2/3", "1/6"], answer: "1/3",
        explainNl: "Deel boven en onder door 2: 2÷2 = 1 en 6÷2 = 3 → 1/3.",
        explainZh: "分子分母同时除以 2：2÷2 = 1，6÷2 = 3 → 1/3。",
        wrongNl: {
          "1/2": "6 ÷ 2 is 3, geen 2! Controleer: 1/2 = 3/6, niet 2/6.",
          "2/3": "Je hebt 6 door 2 gedeeld (3), maar je vergat de bovenkant (2) ook door 2 te delen!",
          "1/6": "Als je de bovenkant door 2 deelt (1), moet de onderkant (6) ook door 2 → 3!"
        },
        wrongZh: {
          "1/2": "6 除以 2 等于 3，不是 2！1/2 等于 3/6，不是 2/6。",
          "2/3": "分母除以了 2，但忘了把分子 2 也除以 2！",
          "1/6": "分子除以 2 变成 1，分母 6 也要除以 2 变成 3！"
        } },
      { id: "v2", cat: 1, type: "choice",
        promptNl: "Vereenvoudig de breuk 6/10 zo ver mogelijk.", promptZh: "把分数 6/10 约分到最简：",
        subNl: "Beide getallen zijn even — deel door 2!", subZh: "两个都是偶数，先同时除以 2！",
        options: ["3/5", "2/5", "3/10", "1/2"], answer: "3/5",
        explainNl: "6÷2 = 3 en 10÷2 = 5 → 3/5 (verder delen kan niet).",
        explainZh: "6÷2 = 3，10÷2 = 5 → 3/5。",
        wrongNl: {
          "2/5": "6 ÷ 2 is 3, geen 2!",
          "3/10": "Je vergat de onderkant (10) ook door 2 te delen!",
          "1/2": "1/2 = 5/10, maar we hadden 6/10."
        },
        wrongZh: {
          "2/5": "6 ÷ 2 等于 3，不是 2！",
          "3/10": "忘了把分母 10 也除以 2！",
          "1/2": "1/2 是 5/10，不是 6/10。"
        } },
      { id: "v3", cat: 1, type: "choice",
        promptNl: "Vereenvoudig de breuk 4/12 zo ver mogelijk.", promptZh: "把分数 4/12 约分到最简：",
        subNl: "Tip: deel meteen door 4 (of 2x door 2)!", subZh: "提示：上下同时除以 4（或连除两次 2）！",
        options: ["1/3", "1/4", "2/6", "2/3"], answer: "1/3",
        explainNl: "4÷4 = 1 en 12÷4 = 3 → 1/3!",
        explainZh: "4÷4 = 1，12÷4 = 3 → 1/3！",
        wrongNl: {
          "2/6": "⚠️ Nog niet ver genoeg! 2/6 kun je nog een keer door 2 delen → 1/3!",
          "1/4": "12 ÷ 4 = 3, geen 4! (1/4 = 3/12)",
          "2/3": "2/3 = 8/12, dat is te groot!"
        },
        wrongZh: {
          "2/6": "⚠️ 还没约到最简！2/6 还能继续同时除以 2 变成 1/3！",
          "1/4": "12 ÷ 4 等于 3，不是 4！",
          "2/3": "2/3 等于 8/12，太大了！"
        } },
      { id: "v4", cat: 1, type: "choice",
        promptNl: "Vereenvoudig de breuk 6/8 zo ver mogelijk.", promptZh: "把分数 6/8 约分到最简：",
        subNl: "Extra oefening", subZh: "巩固练习",
        options: ["3/4", "2/4", "1/2", "3/8"], answer: "3/4",
        explainNl: "Deel boven en onder door 2: 6÷2 = 3 en 8÷2 = 4 → 3/4.",
        explainZh: "上下同时除以 2 → 3/4。",
        wrongNl: {
          "2/4": "6 ÷ 2 = 3, geen 2.",
          "1/2": "1/2 = 4/8, niet 6/8.",
          "3/8": "Je vergat 8 door 2 te delen!"
        },
        wrongZh: {
          "2/4": "6 ÷ 2 等于 3，不是 2。",
          "1/2": "1/2 是 4/8，不是 6/8。",
          "3/8": "忘了把分母 8 也除以 2！"
        } },

      // 2. Hele uithalen (假分数化带分数)
      { id: "h1", cat: 2, type: "choice",

      if (!state.sfxOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const notes = type === "win" ? [523, 659, 784, 1046] : (type === "ok" ? [523, 659] : [220, 175]);
        notes.forEach((freq, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type = type === "err" ? "sawtooth" : "triangle";
          o.frequency.setValueAtTime(freq, now + i * 0.08);
          g.gain.setValueAtTime(0.12, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.18);

    // SVG 披萨分数生成器
    function renderPizzaSvg(num, den, color) {
      const r = 56, cx = 64, cy = 64;
      let paths = "";
      for (let i = 0; i < den; i++) {
        const a1 = (i / den) * 2 * Math.PI - Math.PI / 2;
        const a2 = ((i + 1) / den) * 2 * Math.PI - Math.PI / 2;
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
        const large = (1 / den) > 0.5 ? 1 : 0;
        const fill = i < num ? (color || "#ff9600") : "#f1f5f9";
        paths += `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${fill}" stroke="#334155" stroke-width="2"/>`;
      }
      return `<svg width="128" height="128" viewBox="0 0 128 128">${paths}</svg>`;
    }

      lesson = {
        active: true, lvId, isExam: lvId === 8, queue: steps, totalBase: steps.length,
        doneCount: 0, firstTryRight: 0, examErrors: [], selected: null,
        checked: false, lastOk: false, lastFbTitle: "", lastFbDetail: "",
        pizzaNum: 2, pizzaDen: 6
      };
      document.getElementById("map-shell").classList.add("hidden");
      document.getElementById("lesson-shell").classList.add("active");
      renderCurrentStep();
    }
    function exitLesson() {
      lesson = null;
      document.getElementById("lesson-shell").classList.remove("active");
      document.getElementById("map-shell").classList.remove("hidden");
      renderMap();
    }
    function setPizza(n, d) { lesson.pizzaNum = n; lesson.pizzaDen = d; renderCurrentStep(); }

    function renderCurrentStep() {
      if (!lesson) return;
      if (lesson.queue.length === 0) { renderVictoryScreen(); return; }
      const step = lesson.queue[0];
      const pct = Math.min(100, Math.round((lesson.doneCount / (lesson.doneCount + lesson.queue.length)) * 100));
      document.getElementById("duo-bar-fill").style.width = `${pct}%`;
      document.getElementById("lesson-counter").textContent = `${lesson.doneCount + 1} / ${lesson.doneCount + lesson.queue.length}`;

      const body = document.getElementById("lesson-body");
      const badgeHtml = `<div class="step-badge ${step.isRetry ? "retry" : ""}">${step.isRetry ? `🔁 ${t("Oefen nog een keer", "错题再练一次")}` : `✨ ${t(step.tagNl, step.tagZh)}`}</div>`;

      if (step.kind === "teach_pizza") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🍕 ${tBlock("Pizza-Lab: Waarom is 2/6 hetzelfde als 1/3?", "披萨实验室：为什么 2/6 和 1/3 一样多？")}</h2>
          <div class="teach-card">
            <p style="margin:0 0 8px; font-size:0.92rem;">${tBlock("Vereenvoudigen betekent: minder stukjes snijden, maar evenveel pizza houden! Deel boven en onder door hetzelfde getal.", "约分就是把小块拼成大块，吃到的披萨一样多！分子分母同时除以相同的数。")}</p>
            <div class="pizza-lab">
              <div style="text-align:center;">
                ${renderPizzaSvg(lesson.pizzaNum, lesson.pizzaDen, "#ff9600")}
                <div style="font-weight:900; font-size:1.2rem; color:var(--orange-dark);">${lesson.pizzaNum}/${lesson.pizzaDen}</div>
              </div>
              <div class="pizza-controls">
                <strong>${t("Klik en vergelijk:", "点按钮对比看看：")}</strong>
                <div class="mini-switch">
                  <button class="${lesson.pizzaDen===6 && lesson.pizzaNum===2 ? "active":""}" onclick="setPizza(2,6)">2/6</button>
                  <button class="${lesson.pizzaDen===3 && lesson.pizzaNum===1 ? "active":""}" onclick="setPizza(1,3)">= 1/3</button>
                  <button class="${lesson.pizzaDen===12 && lesson.pizzaNum===4 ? "active":""}" onclick="setPizza(4,12)">= 4/12</button>
                  <button class="${lesson.pizzaDen===10 && lesson.pizzaNum===6 ? "active":""}" onclick="setPizza(6,10)">6/10</button>
                  <button class="${lesson.pizzaDen===5 && lesson.pizzaNum===3 ? "active":""}" onclick="setPizza(3,5)">= 3/5</button>
                </div>
                <div style="font-size:0.86rem; color:var(--muted);">${tBlock("Zie je dat 2/6, 1/3 en 4/12 precies dezelfde hoek pizza zijn?", "看！2/6、1/3 和 4/12 占的披萨面积完全一模一样！")}</div>
              </div>
            </div>
          </div>`;
        lesson.checked = true; lesson.lastOk = true; renderFooter();
      } else if (step.kind === "teach_helen") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🍕 ${tBlock("Helen uithalen (bijv. 7/4 → 1 3/4)", "课前秘籍：假分数化带分数（比如 7/4 → 1 3/4）")}</h2>
          <div class="teach-card">
            <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
              ${renderPizzaSvg(4, 4, "#58cc02")}
              ${renderPizzaSvg(3, 4, "#ff9600")}
              <div style="font-size:1.1rem; font-weight:900;">4/4 + 3/4 = 7/4 = <span style="color:var(--green-dark);">1 3/4</span></div>
            </div>
            <p style="margin:0; font-size:0.92rem;">💡 ${tBlock("Tel hoeveel hele pizza's je hebt (1 hele = 4/4), en schrijf wat overblijft als breuk (7 - 4 = 3 → 1 3/4). De noemer (/4) verandert nooit!", "看分子里面能凑出几个整块（如 4/4），剩下的做分子（7 - 4 = 3），分母永远不变！")}</p>
          </div>`;
        lesson.checked = true; lesson.lastOk = true; renderFooter();
      } else if (step.kind === "teach_samen") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🧩 ${tBlock("Helen samenvoegen (bijv. 2 1/5 → 11/5)", "课前秘籍：带分数化假分数（避开 21/5 陷阱！）")}</h2>
          <div class="teach-card">
            <p style="font-size:0.95rem; font-weight:800; color:#b91c1c;">⚠️ ${tBlock("PAS OP: Plak de cijfers NOOIT aan elkaar (1 2/3 is GEEN 12/3, en 2 1/5 is GEEN 21/5)!", "⚠️ 最容易错：绝对不能把整数和分子直接拼在一起（1 2/3 不是 12/3，2 1/5 不是 21/5）！")}</p>
            <p style="font-size:0.94rem;">✅ ${tBlock("Gouden truc: (hele × noemer) + teller! Voor 2 1/5: (2 × 5) + 1 = 11 → 11/5!", "黄金口诀：（整数 × 分母）+ 分子！比如 2 1/5 = (2 × 5 + 1)/5 = 11/5！")}</p>
          </div>`;
        lesson.checked = true; lesson.lastOk = true; renderFooter();
      } else if (step.kind === "teach_optel") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">⚖️ ${tBlock("Optellen & Aftrekken: Noemers NOOIT optellen!", "课前秘籍：通分与加减（分母绝对不能相加！）")}</h2>
          <div class="teach-card">
            <p style="font-size:0.92rem;">• <strong>1/5 + 3/5 = 4/5</strong> (${tBlock("NIET 4/10!", "不是 4/10！")})</p>
            <p style="font-size:0.92rem;">• <strong>1/2 + 1/6 = ?</strong> → ${tBlock("Maak de stukjes eerst even groot (×3): 1/2 = 3/6. Dan 3/6 + 1/6 = 4/6!", "先通分让披萨块一样大：1/2 = 3/6，再算 3/6 + 1/6 = 4/6！")}</p>
          </div>`;
        lesson.checked = true; lesson.lastOk = true; renderFooter();
      } else if (step.kind === "teach_keer") {
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🎯 ${tBlock("Let op het verschil: Type I vs Type II!", "课前秘籍：分清“求部分”和“求整体”！")}</h2>
          <div class="teach-card">
            <p style="font-size:0.92rem;"><strong>1️⃣ ${tBlock("Totaal is bekend (bijv. 3/4 van 40):", "已知总数求部分（如 40 页的 3/4）：")}</strong><br>
              ${tBlock("÷ noemer (40 ÷ 4 = 10), dan × teller (10 × 3 = 30)!", "先除以分母（40÷4=10），再乘以分子（10×3=30）！")}</p>
            <p style="font-size:0.92rem; margin-bottom:0;"><strong>2️⃣ ${tBlock("Deel is bekend, zoek het HEEL (bijv. 2/3 = 18 cm):", "已知部分求整体（如 2/3 是 18 cm，求整条）：")}</strong><br>
              ${tBlock("Omgekeerd! Eerst ÷ teller (18 ÷ 2 = 9 cm = 1 stukje), dan × noemer (9 × 3 = 27 cm)!", "反过来！先除以分子求 1 份（18÷2=9），再乘以分母求全部（9×3=27）！")}</p>
          </div>`;
        lesson.checked = true; lesson.lastOk = true; renderFooter();
      } else if (step.kind === "q") {
        const q = step.q;
        if (!step._opts) step._opts = shuffle(q.options);
        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">${tBlock(q.promptNl, q.promptZh)}</h2>
          <p class="q-sub">${tBlock(q.subNl, q.subZh)}</p>
          <div class="choice-grid">
            ${step._opts.map((o, i) => {
              let cls = "";
              if (lesson.checked) { if (o === q.answer) cls = "correct"; else if (lesson.selected === o) cls = "wrong"; }
              else if (lesson.selected === o) cls = "selected";
              return `<button class="choice-tile ${cls}" ${lesson.checked ? "disabled" : ""} onclick="selectChoice(${JSON.stringify(o).replace(/"/g, '&quot;')})"><span class="tile-num">${i + 1}</span><span>${escapeHtml(o)}</span></button>`;
            }).join("")}
          </div>`;
        renderFooter();
      }
    }

    function selectChoice(val) { if (lesson.checked) return; lesson.selected = val; renderCurrentStep(); }

    function renderFooter() {
      const footer = document.getElementById("lesson-footer"), inner = document.getElementById("footer-inner"), step = lesson.queue[0];
      if (step.kind.startsWith("teach_")) {
        footer.className = "lesson-footer";
        inner.innerHTML = `<div class="fb-text"><div class="fb-detail">🚀 ${t("Truc begrepen? Starten maar!", "看懂方法了吗？开始做题！")}</div></div>
          <button class="duo-btn blue" onclick="nextStep()">${t("IK SNAP HET! START →", "懂了！开始闯关 →")}</button>`;
        return;
      }
      if (!lesson.checked) {
        footer.className = "lesson-footer";
        inner.innerHTML = `<div class="fb-text"></div><button class="duo-btn" id="btn-check-step" ${lesson.selected !== null ? "" : "disabled"} onclick="checkCurrentStep()">${t("CONTROLEER", "检查答案")}</button>`;
      } else {
        footer.className = `lesson-footer ${lesson.lastOk ? "ok" : "err"}`;
        inner.innerHTML = `<div class="fb-text"><div class="fb-title">${lesson.lastOk ? "✅" : "❌"} ${lesson.lastFbTitle}</div><div class="fb-detail">${lesson.lastFbDetail}</div></div>
          <button class="duo-btn ${lesson.lastOk ? "" : "red"}" onclick="nextStep()">${t("GA DOOR", "下一题")} →</button>`;
      }
    }

    function checkCurrentStep() {
      if (!lesson || lesson.checked) return;
      const step = lesson.queue[0], q = step.q;
      lesson.checked = true;
      const ok = lesson.selected === q.answer;
      let fbTitle = "", fbDetail = "";

      if (ok) {
        fbTitle = t("Supergoed!", "算对啦！");
        fbDetail = `<div class="fb-why">💡 ${tBlock(q.explainNl, q.explainZh)}</div>`;
        state.xp += 10; state.streak += 1; delete state.mistakes[q.id];
        if (!step.isRetry) lesson.firstTryRight++;
        playTone("ok");
      } else {
        fbTitle = t(`Goede antwoord: ${q.answer}`, `正确答案：${q.answer}`);
        const wNl = q.wrongNl && q.wrongNl[lesson.selected];
        const wZh = q.wrongZh && q.wrongZh[lesson.selected];
        const whyHtml = wNl ? `<div class="fb-why">❌ <strong>${escapeHtml(lesson.selected)}</strong>: ${tBlock(wNl, wZh)}</div>` : "";
        fbDetail = `${whyHtml}<div style="margin-top:5px;">💡 ${tBlock(q.explainNl, q.explainZh)}</div>`;
        state.streak = 0; state.mistakes[q.id] = { id: q.id }; playTone("err");
        if (lesson.isExam) lesson.examErrors.push(`${q.promptNl} → ${q.answer}`);
        else lesson.queue.push({ ...step, isRetry: true });
      }
      saveState();
      lesson.lastOk = ok; lesson.lastFbTitle = fbTitle; lesson.lastFbDetail = fbDetail;
      renderCurrentStep();
    }

    function nextStep() {
      if (!lesson) return;
      lesson.queue.shift(); lesson.doneCount++; lesson.selected = null; lesson.checked = false;
      renderCurrentStep();
    }

    function renderVictoryScreen() {
      playTone("win");
      const lvId = lesson.lvId;
      state.completedLevels[lvId] = true;
      const prev = state.unlockedLevel;
      if (lvId >= state.unlockedLevel && lvId < LEVELS.length) state.unlockedLevel = lvId + 1;
      healUnlockedLevel();
      const unlockedNew = state.unlockedLevel > prev;
      state.xp += 30;
      document.getElementById("duo-bar-fill").style.width = "100%";
      document.getElementById("lesson-counter").textContent = "✓";
      const body = document.getElementById("lesson-body"), footer = document.getElementById("lesson-footer"), inner = document.getElementById("footer-inner");
      footer.className = "lesson-footer ok";

      if (lesson.isExam) {
        const cijfer = (1 + (lesson.firstTryRight / lesson.totalBase) * 9).toFixed(1);
        if (!state.bestCijfer || parseFloat(cijfer) > parseFloat(state.bestCijfer)) state.bestCijfer = cijfer;
        saveState(true);
        body.innerHTML = `<div class="victory-box"><h2 class="q-title">🏆 ${t("Eindtoets klaar!", "模拟考完成！")}</h2>
          <div class="cijfer-circle">${cijfer}<span>/ 10 Cijfer</span></div>
          <p class="q-sub"><strong>${lesson.firstTryRight} / ${lesson.totalBase}</strong> ${t("goed", "题答对")}</p>
          ${lesson.examErrors.length ? `<div class="review-list">${lesson.examErrors.map(e => `<div class="review-item">❌ ${escapeHtml(e)}</div>`).join("")}</div>` : `<div style="color:#166534; font-weight:900;">✨ 10!</div>`}</div>`;
        inner.innerHTML = `<div class="fb-text"><div class="fb-title">🎉 +30 XP</div></div><button class="duo-btn" onclick="exitLesson()">${t("TERUG NAAR KAART", "返回地图")}</button>`;
      } else {
        saveState(true);
        const nextLv = LEVELS.find(x => x.id === lvId + 1);
        body.innerHTML = `<div class="victory-box"><div style="font-size:4rem;">🏆✨</div>
          <h2 class="q-title">${t(`Level ${lvId} gehaald, Ernst!`, `第 ${lvId} 关通关！`)}</h2>
          <p class="q-sub">+30 XP · 🔥 ${state.streak}</p>
          ${unlockedNew && nextLv ? `<div style="display:inline-block; background:var(--gold-soft); border:2px solid var(--gold); border-radius:16px; padding:12px 18px; font-weight:900; color:#854d0e;">🔓 ${t(`Ontgrendeld: ${nextLv.icon} ${nextLv.titleNl}`, `已解锁：${nextLv.icon} ${nextLv.titleZh}`)}</div>` : ""}</div>`;
        inner.innerHTML = `<div class="fb-text"><div class="fb-title">🌟 +30 XP</div></div>
          <div style="display:flex; gap:10px;"><button class="duo-btn outline" onclick="exitLesson()">${t("KAART", "回地图")}</button>
          ${nextLv ? `<button class="duo-btn blue" onclick="startLevel(${nextLv.id})">LEVEL ${nextLv.id} →</button>` : ""}</div>`;
      }
    }

    function openGuide() {
      document.getElementById("guide-modal-title").textContent = t("📘 Rekenen Spiekbriefje: Breuken", "📘 数学秘籍：分数 8 大口诀");
      document.getElementById("btn-guide-close").textContent = t("SLUITEN", "关闭并继续");
      document.getElementById("guide-modal-body").innerHTML = `
        <div class="guide-sec"><h3>1. Vereenvoudigen &amp; Helen</h3>
          <p style="font-size:0.88rem;">• <strong>Vereenvoudigen</strong>: Deel boven én onder door hetzelfde getal (4/12 → 1/3).</p>
          <p style="font-size:0.88rem;">• <strong>Helen uithalen</strong>: 7/4 = 4/4 + 3/4 = 1 3/4 (noemer blijft altijd hetzelfde!).</p>
          <p style="font-size:0.88rem;">• <strong>Helen samenvoegen</strong>: (hele × noemer) + teller → 2 1/5 = (2×5+1)/5 = 11/5 (❌ niet 21/5!).</p>
        </div>
        <div class="guide-sec"><h3>2. Gelijknamig, Optellen &amp; Aftrekken</h3>
          <p style="font-size:0.88rem;">• <strong>Noemers optellen mag NOOIT!</strong> (1/5 + 3/5 = 4/5, ❌ niet 4/10).</p>
          <p style="font-size:0.88rem;">• <strong>Ongelijknamig</strong>: Maak eerst dezelfde noemer (1/2 + 1/6 = 3/6 + 1/6 = 4/6).</p>
        </div>
        <div class="guide-sec" style="margin-bottom:0;"><h3>3. Breuk keer getal I &amp; II</h3>
          <p style="font-size:0.88rem;">• <strong>Totaal → Deel</strong> (3/4 van 40): ÷ noemer (40÷4=10), dan × teller (10×3=30).</p>
          <p style="font-size:0.88rem;">• <strong>Deel → Heel</strong> (2/3 = 18 cm): ÷ teller (18÷2=9), dan × noemer (9×3=27 cm).</p>
        </div>`;
      document.getElementById("guide-modal").classList.add("open");
    }
    function closeGuide() { document.getElementById("guide-modal").classList.remove("open"); }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeGuide(); return; }
      if (document.getElementById("guide-modal").classList.contains("open") || !lesson || !lesson.active || e.key !== "Enter") return;
      const step = lesson.queue[0]; if (!step) return;
      if (step.kind.startsWith("teach_")) { nextStep(); return; }
      if (!lesson.checked) { if (lesson.selected !== null) checkCurrentStep(); } else nextStep();
    });

    loadState(); renderMap(); syncCloudPull();
  </script>
</body>
</html>
