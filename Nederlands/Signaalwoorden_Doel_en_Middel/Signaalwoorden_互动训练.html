<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ernst NL" />
  <meta name="theme-color" content="#ff9600" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23ff9600'/%3E%3Ctext x='90' y='122' font-size='100' text-anchor='middle'%3E%F0%9F%87%B3%F0%9F%87%B1%3C/text%3E%3C/svg%3E" />
  <title>Ernst's Nederlands · Doel &amp; Middel Quest</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --green: #58cc02;
      --green-dark: #46a302;
      --green-soft: #e9fad9;
      --blue: #1cb0f6;
      --blue-dark: #0095db;
      --blue-soft: #e6f7ff;
      --purple: #ce82ff;
      --purple-dark: #9b51e0;
      --purple-soft: #f5ebff;
      --gold: #ffc800;
      --gold-dark: #e09f00;
      --gold-soft: #fff8d6;
      --orange: #ff9600;
      --orange-dark: #e07b00;
      --red: #ff4b4b;
      --red-dark: #d93636;
      --red-soft: #ffecec;
      --gray: #e5e5e5;
      --gray-dark: #afafaf;
      --text: #3c3c3c;
      --muted: #777777;
      --border: #e5e5e5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* TOPBAR */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: #fff; border-bottom: 2px solid var(--border); padding: 10px 16px;
    }
    .topbar-inner {
      max-width: 780px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    }
    .brand-mini { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.02rem; color: var(--orange-dark); }
    .back-home {
      text-decoration: none; border: 2px solid var(--border); border-radius: 10px;
      padding: 4px 9px; font-size: 0.82rem; font-weight: 800; color: var(--text); background: #fff;
    }
    .stats-row { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.88rem; }
    .stat-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #f1f5f9; }
    .controls-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lang-group { display: inline-flex; background: #f1f5f9; border-radius: 10px; padding: 2px; }
    .lang-btn {
      border: none; background: transparent; padding: 5px 9px; border-radius: 8px;
      font-size: 0.78rem; font-weight: 800; cursor: pointer; color: var(--muted);
    }
    .lang-btn.active { background: #fff; color: var(--blue-dark); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .icon-btn {
      border: 2px solid var(--border); background: #fff; border-radius: 10px;
      padding: 4px 9px; font-size: 0.8rem; font-weight: 800; cursor: pointer; color: var(--text);
    }
    .icon-btn.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }

    /* MAP */
    .map-container { max-width: 640px; margin: 20px auto 64px; padding: 0 16px; }
    .unit-banner {
      color: #fff; border-radius: 20px; padding: 16px 20px; margin: 22px 0;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .unit-banner.sec1 { background: linear-gradient(135deg, #ff9600, #e07b00); box-shadow: 0 5px 0 #b86200; margin-top: 4px; }
    .unit-banner.sec2 { background: linear-gradient(135deg, #1cb0f6, #0095db); box-shadow: 0 5px 0 #0077b3; }
    .unit-banner.sec3 { background: linear-gradient(135deg, #9333ea, #7c3aed); box-shadow: 0 5px 0 #5b21b6; }
    .unit-banner h2 { margin: 0; font-size: 1.12rem; }
    .unit-banner p { margin: 3px 0 0; font-size: 0.84rem; opacity: 0.95; }
    .unit-progress-pill { background: rgba(255,255,255,0.22); border-radius: 12px; padding: 6px 12px; font-weight: 900; font-size: 0.88rem; white-space: nowrap; }

    .path-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0 8px; }
    .path-step { display: flex; flex-direction: column; align-items: center; position: relative; }
    .path-connector { width: 6px; height: 18px; border-radius: 99px; background: var(--gray); }
    .path-connector.done { background: var(--green); }
    .node-row { display: flex; align-items: center; gap: 14px; }
    .node-btn {
      width: 80px; height: 74px; border-radius: 50%; border: none; font-size: 1.9rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      position: relative; transition: transform 0.12s; user-select: none;
    }
    .node-btn:active:not(:disabled) { transform: translateY(4px); }
    .node-btn.locked { background: var(--gray); box-shadow: 0 7px 0 #cfcfcf; color: #999; cursor: not-allowed; }
    .node-btn.current { background: var(--orange); box-shadow: 0 7px 0 var(--orange-dark); color: #fff; animation: gentlePulse 1.8s infinite; }
    .node-btn.current.boss { background: var(--blue); box-shadow: 0 7px 0 var(--blue-dark); }
    .node-btn.current.exam { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dark); }
    .node-btn.done { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dark); color: #fff; }
    .node-check {
      position: absolute; top: -4px; right: -4px; background: var(--green); color: #fff;
      border: 3px solid #fff; width: 26px; height: 26px; border-radius: 50%;
      font-size: 0.82rem; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .start-bubble {
      position: absolute; top: -34px; background: #fff; color: var(--orange-dark);
      border: 2px solid var(--border); border-radius: 12px; padding: 3px 12px;
      font-size: 0.76rem; font-weight: 900; letter-spacing: 0.6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08); white-space: nowrap; animation: floatY 1.6s ease-in-out infinite;
    }
    .node-label { margin-top: 9px; text-align: center; max-width: 260px; }
    .node-title { font-weight: 900; font-size: 0.94rem; color: var(--text); }
    .node-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .robot-buddy { font-size: 2.2rem; animation: floatY 2.2s ease-in-out infinite; }
    @keyframes gentlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .parent-bar {
      margin-top: 28px; padding: 12px 16px; background: #fff; border: 2px dashed var(--border);
      border-radius: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; font-size: 0.83rem; color: var(--muted);
    }

    /* FULLSCREEN LESSON */
    .lesson-shell { display: none; min-height: 100vh; flex-direction: column; background: #fff; }
    .lesson-shell.active { display: flex; }
    .map-shell.hidden { display: none; }
    .lesson-top {
      max-width: 720px; width: 100%; margin: 0 auto; padding: 18px 18px 10px;
      display: flex; align-items: center; gap: 14px;
    }
    .close-btn { border: none; background: transparent; font-size: 1.5rem; font-weight: 900; color: var(--gray-dark); cursor: pointer; padding: 4px 8px; border-radius: 10px; }
    .close-btn:hover { background: #f1f5f9; color: var(--text); }
    .duo-bar-track { flex: 1; height: 16px; background: var(--gray); border-radius: 999px; overflow: hidden; }
    .duo-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--orange), #ffc800); border-radius: 999px; transition: width 0.3s ease; }
    .lesson-counter { font-weight: 900; font-size: 0.9rem; color: var(--muted); min-width: 56px; text-align: right; }

    .lesson-body {
      flex: 1; max-width: 680px; width: 100%; margin: 0 auto; padding: 16px 20px 175px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .step-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; color: var(--orange-dark); margin-bottom: 8px; }
    .step-badge.retry { color: var(--red-dark); }
    .q-title { font-size: 1.38rem; font-weight: 900; margin: 0 0 8px; color: var(--text); line-height: 1.38; }
    .q-sub { font-size: 0.96rem; color: var(--muted); margin: 0 0 18px; }
    .bilingual-zh { display: block; font-size: 0.85em; font-weight: 600; color: #64748b; margin-top: 3px; }

    .duo-btn {
      border: none; border-radius: 16px; padding: 14px 26px; font-size: 1rem; font-weight: 900;
      cursor: pointer; transition: transform 0.1s; color: #fff; background: var(--green); box-shadow: 0 5px 0 var(--green-dark);
    }
    .duo-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--green-dark); }
    .duo-btn:disabled { background: var(--gray); box-shadow: 0 5px 0 #cfcfcf; color: #999; cursor: not-allowed; }
    .duo-btn.orange { background: var(--orange); box-shadow: 0 5px 0 var(--orange-dark); }
    .duo-btn.red { background: var(--red); box-shadow: 0 5px 0 var(--red-dark); }
    .duo-btn.outline { background: #fff; color: var(--text); border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }

    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
    .choice-grid.single-col { grid-template-columns: 1fr; }
    @media (max-width: 560px) { .choice-grid { grid-template-columns: 1fr; } }
    .choice-tile {
      border: 2px solid var(--border); border-bottom-width: 5px; background: #fff; border-radius: 16px;
      padding: 14px 16px; font-size: 1rem; font-weight: 800; text-align: left; cursor: pointer;
      color: var(--text); transition: all 0.12s; display: flex; align-items: center; gap: 10px;
    }
    .choice-tile:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
    .choice-tile.selected { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }
    .choice-tile.correct { border-color: var(--green); background: var(--green-soft); color: #2b7000; }
    .choice-tile.wrong { border-color: var(--red); background: var(--red-soft); color: #a81c1c; }
    .tile-num { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 0.78rem; color: var(--muted); flex-shrink: 0; }

    /* Sentence Builder */
    .sentence-slot {
      min-height: 68px; border: 2.5px dashed #cbd5e1; border-radius: 16px; padding: 10px 12px;
      background: #f8fafc; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    .sentence-slot.has-words { border-style: solid; border-color: var(--blue); background: #fcfeff; }
    .word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 6px 0; }
    .wb-chip {
      border: 2px solid var(--border); border-bottom-width: 4px; background: #fff; border-radius: 14px;
      padding: 10px 14px; font-size: 1rem; font-weight: 800; cursor: pointer; color: var(--text);
    }
    .wb-chip.placed { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }
    .wb-chip.used { opacity: 0.22; pointer-events: none; }

    .spell-input {
      width: 100%; padding: 15px 18px; font-size: 1.2rem; font-weight: 800;
      border: 2px solid #cbd5e1; border-bottom-width: 5px; border-radius: 16px; outline: none;
    }
    .spell-input:focus { border-color: var(--blue); background: #fcfeff; }

    /* Teach cards */
    .teach-card { border: 2px solid #e2e8f0; border-radius: 18px; padding: 18px; background: #fafcff; }
    .teach-card ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.92rem; }
    .teach-card li { margin-bottom: 6px; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 8px; font-weight: 900; font-size: 0.88rem; }
    .pill-doel { background: #ffedd5; color: #9a3412; }
    .pill-mid { background: #dbeafe; color: #1e40af; }
    .pill-warn { background: #fee2e2; color: #991b1b; }
    .mini-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; margin-top: 8px; background: #fff; }
    .mini-table th, .mini-table td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; }
    .mini-table th { background: #eff6ff; color: #1e3a8a; }

    /* Footer */
    .lesson-footer { position: fixed; bottom: 0; left: 0; right: 0; border-top: 2px solid var(--border); background: #fff; padding: 14px 20px; z-index: 30; }
    .lesson-footer.ok { background: var(--green-soft); border-top-color: #b7eb8f; }
    .lesson-footer.err { background: var(--red-soft); border-top-color: #ffa39e; }
    .footer-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .fb-text { flex: 1; min-width: 220px; }
    .fb-title { font-size: 1.08rem; font-weight: 900; margin-bottom: 3px; }
    .lesson-footer.ok .fb-title { color: #2b7000; }
    .lesson-footer.err .fb-title { color: #b91c1c; }
    .fb-detail { font-size: 0.9rem; color: var(--text); font-weight: 600; }
    .fb-why {
      margin-top: 6px; padding: 7px 10px; border-radius: 10px;
      background: rgba(255,255,255,0.78); border-left: 4px solid var(--red);
      font-size: 0.86rem; line-height: 1.4;
    }
    .lesson-footer.ok .fb-why { border-left-color: var(--green); }

    /* Victory */
    .victory-box { text-align: center; padding: 16px 10px; }
    .cijfer-circle {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      width: 150px; height: 150px; border-radius: 50%;
      background: linear-gradient(135deg, #c2410c, #f97316); color: #fff;
      font-size: 2.7rem; font-weight: 900; margin: 14px 0; box-shadow: 0 10px 26px rgba(234,88,12,0.28);
    }
    .cijfer-circle span { font-size: 0.85rem; font-weight: 700; }
    .review-list { text-align: left; margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .review-item { padding: 10px 14px; border-radius: 12px; border: 1.5px solid #fecaca; background: #fff5f5; font-size: 0.9rem; }

    /* Guide Modal */
    .guide-modal { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(15,23,42,0.55); padding: 16px; overflow-y: auto; align-items: flex-start; justify-content: center; }
    .guide-modal.open { display: flex; }
    .guide-sheet { background: #fff; border-radius: 22px; max-width: 720px; width: 100%; margin: 18px auto 36px; padding: 20px; box-shadow: 0 20px 48px rgba(15,23,42,0.25); }
    .guide-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid var(--border); margin-bottom: 14px; }
    .guide-sec { border: 2px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; background: #fafcff; }
    .guide-sec h3 { margin: 0 0 8px; font-size: 1rem; color: #9a3412; }
  </style>
</head>
<body>
  <div class="map-shell" id="map-shell">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand-mini">
          <a class="back-home" href="../../index.html">🏠</a>
          <span>🇳🇱 <span id="brand-txt"></span></span>
        </div>
        <div class="stats-row">
          <span class="stat-chip">⚡ <span id="stat-xp">0</span> XP</span>
          <span class="stat-chip">🔥 <span id="stat-streak">0</span></span>
        </div>
        <div class="controls-row">
          <div class="lang-group">
            <button class="lang-btn active" id="lang-nl" onclick="setLang('nl')">🇳🇱 NL</button>
            <button class="lang-btn" id="lang-both" onclick="setLang('both')">🌐 NL+中</button>
            <button class="lang-btn" id="lang-zh" onclick="setLang('zh')">🇨🇳 中文</button>
          </div>
          <button class="icon-btn on" id="btn-speech" onclick="toggleSpeech()">🔊</button>
          <button class="icon-btn on" id="btn-sfx" onclick="toggleSfx()">🎵</button>
          <button class="icon-btn" id="btn-guide-map" onclick="openGuide()">📘</button>
          <button class="icon-btn" id="btn-cloud" onclick="openCloudSettings()">☁️</button>
        </div>
      </div>
    </div>

    <div class="map-container">
      <div id="map-sections"></div>
      <div class="parent-bar">
        <span id="parent-hint"></span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="icon-btn" id="btn-parent-mode" onclick="toggleParentMode()"></button>
          <button class="icon-btn" id="btn-reset" onclick="resetProgress()"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="lesson-shell" id="lesson-shell">
    <div class="lesson-top">
      <button class="close-btn" onclick="exitLesson()" title="Terug">✕</button>
      <div class="duo-bar-track"><div class="duo-bar-fill" id="duo-bar-fill"></div></div>
      <div class="lesson-counter" id="lesson-counter">1 / 10</div>
      <button class="icon-btn" id="btn-guide-lesson" onclick="openGuide()">📘</button>
    </div>
    <div class="lesson-body" id="lesson-body"></div>
    <div class="lesson-footer" id="lesson-footer"><div class="footer-inner" id="footer-inner"></div></div>
  </div>

  <div class="guide-modal" id="guide-modal" onclick="if(event.target===this) closeGuide()">
    <div class="guide-sheet">
      <div class="guide-head">
        <h2 id="guide-modal-title" style="margin:0; font-size:1.15rem;"></h2>
        <button class="close-btn" onclick="closeGuide()">✕</button>
      </div>
      <div id="guide-modal-body"></div>
      <div style="text-align:right; margin-top:12px;">
        <button class="duo-btn" onclick="closeGuide()" id="btn-guide-close">OK</button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================
    // 1. 荷兰语题库：完全对应课堂讲义 & 8道课后练习
    // =====================================================
    const QUESTIONS = [
      // --- DOEL (目的信号词: om...te, opdat, zodat + 陷阱) ---
      { id: "d1", group: "doel", type: "choice",
        promptNl: "Ik moet naar de supermarkt ______ melk ______ kopen.",
        promptZh: "我去超市买牛奶。（表示目的）",
        subNl: "Kies de goede constructie voor een doel:", subZh: "选择表示目的的固定结构：",
        options: ["om ... te", "zodat ... te", "door ... te", "met ... te"],
        answer: "om ... te",
        explainNl: "'om ... te + hele werkwoord' geeft een doel aan: waarom ga je naar de supermarkt? Om melk te kopen!",
        explainZh: "om ... te + 动词原形表示做某事的目的。",
        wrongNl: {
          "zodat ... te": "Na 'zodat' komt een hele bijzin (met onderwerp + werkwoord achteraan), NOOIT 'te'!",
          "door ... te": "'door ... te' geeft een MIDDEL (hoe?) aan, geen DOEL (waarom?)!",
          "met ... te": "Na 'met' komt altijd een zelfstandig naamwoord (bijv. met de fiets), nooit 'te'!"
        },
        wrongZh: {
          "zodat ... te": "zodat 后面接完整从句（主语+动词放句尾），绝不加 te！",
          "door ... te": "door ... te 表示途径/方法（怎么做），不是目的（为什么）！",
          "met ... te": "met 后面只能接名词（如 met de fiets），不能接 te + 动词！"
        } },

      { id: "d2", group: "doel", type: "choice",
        promptNl: "We beginnen met leuke activiteiten, ______ de groep elkaar beter leert kennen.",
        promptZh: "我们用有趣的活动开场，以便大家更好地互相了解。",
        subNl: "Kies het goede signaalwoord van doel (let op: er staat een bijzin met onderwerp!):",
        subZh: "注意后面是带主语 de groep 的完整从句：",
        options: ["zodat", "om", "door", "met behulp van"],
        answer: "zodat",
        explainNl: "Na 'zodat' volgt een bijzin met onderwerp ('de groep') en het werkwoord achteraan ('leert kennen').",
        explainZh: "zodat 后面接带主语的从句，动词放最后！",
        wrongNl: {
          "om": "Bij 'om' gebruik je '... te + hele werkwoord' (zonder nieuw onderwerp), geen bijzin met 'de groep'!",
          "door": "'door' geeft een middel aan (en heeft geen bijzin met onderwerp).",
          "met behulp van": "Na 'met behulp van' komt alleen een naamwoord/persoon, geen hele bijzin!"
        },
        wrongZh: {
          "om": "om 要搭配 te + 动词原形，后面不能接带主语 de groep 的完整从句！",
          "door": "door 表示途径，且不接完整从句。",
          "met behulp van": "met behulp van 后面只能接名词或人，不能接完整句子！"
        } },

      { id: "d3", group: "doel", type: "choice",
        promptNl: "Welk woord is formele schrijftaal voor 'zodat' (als signaalwoord van doel)?",

    }
    async function syncCloudPull() {
      if (typeof fetch !== "function") return;
      cloudStatus = "syncing"; updateCloudBadge();
      const pid = encodeURIComponent(getProfileId());
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/ernst_progress?profile_id=eq.${pid}&select=data,updated_at`, {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const rows = await res.json();
        if (rows && rows.length && rows[0].data) {
          const cd = rows[0].data, cts = cd.updatedAt || Date.parse(rows[0].updated_at) || 0;

    function t(nl, zh) { return state.lang === "nl" ? nl : (state.lang === "zh" ? zh : `${nl} / ${zh}`); }
    function tBlock(nl, zh) { return state.lang === "nl" ? escapeHtml(nl) : (state.lang === "zh" ? escapeHtml(zh) : `${escapeHtml(nl)}<span class="bilingual-zh">${escapeHtml(zh)}</span>`); }
    function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function normalizeAns(s) { return (s || "").trim().replace(/[’`]/g, "'").replace(/\s+/g, " ").toLowerCase(); }

    let audioCtx = null;
    function playTone(type) {
      if (!state.sfxOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const notes = type === "win" ? [523, 659, 784, 1046] : (type === "ok" ? [523, 659] : [220, 175]);
        notes.forEach((freq, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type = type === "err" ? "sawtooth" : "triangle";
          o.frequency.setValueAtTime(freq, now + i * 0.08);
          g.gain.setValueAtTime(0.12, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.18);
          o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.18);
        });
      } catch (e) {}
    }

        body.innerHTML = `
          ${badgeHtml}
          <h2 class="q-title">🧩 ${tBlock("Bouw de goede zin:", "点击词块，拼出正确的荷兰语句子：")}</h2>
          <p class="q-sub"><strong>${tBlock(sb.promptNl, sb.promptZh)}</strong></p>
          <div class="sentence-slot ${lesson.sbPicked.length ? "has-words" : ""}">
            ${lesson.sbPicked.length === 0
              ? `<span style="color:#94a3b8; font-weight:700; font-size:0.9rem;">${t("Klik hieronder op de woorden in de goede volgorde (let op: er zitten instinkers bij!)", "按顺序点击下方词块拼句（小心里面混了干扰词！）")}</span>`
              : lesson.sbPicked.map((bi, pos) => `<button class="wb-chip placed" ${lesson.checked ? "disabled" : ""} onclick="unpickWord(${pos})">${escapeHtml(step._bank[bi])}</button>`).join("")}
          </div>
          <div class="word-bank">
            ${step._bank.map((w, bi) => `<button class="wb-chip ${lesson.sbPicked.includes(bi) ? "used" : ""}" ${lesson.checked ? "disabled" : ""} onclick="pickWord(${bi})">${escapeHtml(w)}</button>`).join("")}
          </div>`;
        renderFooter();
      } else if (step.kind === "q") {
        const q = step.q;
        const promptHtml = q.promptNl === q.promptZh ? escapeHtml(q.promptNl) : tBlock(q.promptNl, q.promptZh);
        if (q.type === "choice") {
          if (!step._opts) step._opts = shuffle(q.options);
          body.innerHTML = `
            ${badgeHtml}
            <h2 class="q-title">${promptHtml} <button class="icon-btn" onclick="speakNl(${JSON.stringify(q.promptNl).replace(/"/g, '&quot;')})">🔊</button></h2>
            <p class="q-sub">${tBlock(q.subNl, q.subZh)}</p>
            <div class="choice-grid ${step._opts.some(x => x.length > 26) ? "single-col" : ""}">
              ${step._opts.map((o, i) => {
                let cls = "";
                if (lesson.checked) { if (o === q.answer) cls = "correct"; else if (lesson.selected === o) cls = "wrong"; }
                else if (lesson.selected === o) cls = "selected";
                return `<button class="choice-tile ${cls}" ${lesson.checked ? "disabled" : ""} onclick="selectChoice(${JSON.stringify(o).replace(/"/g, '&quot;')})"><span class="tile-num">${i + 1}</span><span>${escapeHtml(o)}</span></button>`;
              }).join("")}
            </div>`;
        } else {
          body.innerHTML = `
            ${badgeHtml}
            <h2 class="q-title">${promptHtml}</h2>
            <p class="q-sub">${tBlock(q.subNl, q.subZh)}</p>
            <input type="text" class="spell-input" id="duo-spell-input" autocomplete="off" spellcheck="false"
              value="${escapeHtml(lesson.selected || "")}" ${lesson.checked ? "disabled" : ""}
              placeholder="${t("Typ 1 Nederlands woord...", "输入 1 个荷兰语词...")}" />`;
          setTimeout(() => {
            const inp = document.getElementById("duo-spell-input");
            if (inp && !lesson.checked) {
              inp.focus();
              inp.addEventListener("input", e => { lesson.selected = e.target.value; const b = document.getElementById("btn-check-step"); if (b) b.disabled = !lesson.selected.trim(); });
            }
          }, 0);
        }
        renderFooter();
      }
    }

    function selectChoice(val) { if (lesson.checked) return; lesson.selected = val; renderCurrentStep(); }
    function pickWord(bi) { if (lesson.checked || lesson.sbPicked.includes(bi)) return; lesson.sbPicked.push(bi); renderCurrentStep(); }
    function unpickWord(pos) { if (lesson.checked) return; lesson.sbPicked.splice(pos, 1); renderCurrentStep(); }

    function renderFooter() {
      const footer = document.getElementById("lesson-footer"), inner = document.getElementById("footer-inner"), step = lesson.queue[0];
      if (step.kind.startsWith("teach_")) {
        footer.className = "lesson-footer";
        inner.innerHTML = `<div class="fb-text"><div class="fb-detail">🚀 ${t("Uitleg gelezen? Start de oefeningen!", "看完秘籍了吗？开始闯关！")}</div></div>
          <button class="duo-btn orange" onclick="nextStep()">${t("IK SNAP HET! START →", "懂了！开始闯关 →")}</button>`;
        return;
      }
      if (!lesson.checked) {
        footer.className = "lesson-footer";
        const canCheck = step.kind === "sb" ? lesson.sbPicked.length > 0 : (lesson.selected !== null && String(lesson.selected).trim().length > 0);
        inner.innerHTML = `<div class="fb-text"></div><button class="duo-btn" id="btn-check-step" ${canCheck ? "" : "disabled"} onclick="checkCurrentStep()">${t("CONTROLEER", "检查答案")}</button>`;
      } else {
        footer.className = `lesson-footer ${lesson.lastOk ? "ok" : "err"}`;
        inner.innerHTML = `<div class="fb-text"><div class="fb-title">${lesson.lastOk ? "✅" : "❌"} ${lesson.lastFbTitle}</div><div class="fb-detail">${lesson.lastFbDetail}</div></div>
          <button class="duo-btn ${lesson.lastOk ? "" : "red"}" onclick="nextStep()">${t("GA DOOR", "下一题")} →</button>`;
      }
    }

    function checkCurrentStep() {
      if (!lesson || lesson.checked) return;
      const step = lesson.queue[0];
      lesson.checked = true;
      let ok = false, fbTitle = "", fbDetail = "";

      if (step.kind === "sb") {
        const sb = step.sb, picked = lesson.sbPicked.map(bi => step._bank[bi]), built = picked.join(" "), expected = sb.target.join(" ");
        ok = built === expected; speakNl(expected);
        if (ok) {
          fbTitle = t("Perfecte zin!", "拼句完美！");
          fbDetail = `<div class="fb-why">💡 ${tBlock(sb.explainNl, sb.explainZh)}</div>`;
          handleRecord(true, "sb", sb.id, step);
        } else {
          fbTitle = t(`Goede zin: ${expected}`, `正确句子：${expected}`);
          const traps = picked.filter(w => sb.trapNl && sb.trapNl[w]);
          const trapMsg = traps.length
            ? traps.map(tw => `<div class="fb-why">❌ <strong>${escapeHtml(tw)}</strong>: ${tBlock(sb.trapNl[tw], sb.trapZh[tw])}</div>`).join("")
            : `<div class="fb-why">⚠️ ${tBlock("Let goed op de woordvolgorde (werkwoord achteraan bij zodat!).", "注意词序（zodat 从句动词要放句尾！）。")}</div>`;
          fbDetail = `${trapMsg}<div style="margin-top:5px;">💡 ${tBlock(sb.explainNl, sb.explainZh)}</div>`;
          handleRecord(false, "sb", sb.id, step, `${expected} (${sb.explainNl})`);
        }
      } else if (step.kind === "q") {
        const q = step.q;
        ok = normalizeAns(lesson.selected) === normalizeAns(q.answer);
        if (ok) {
          fbTitle = t("Helemaal goed!", "完全正确！");
          fbDetail = `<div class="fb-why">💡 ${tBlock(q.explainNl, q.explainZh)}</div>`;
          handleRecord(true, "q", q.id, step);
        } else {
          fbTitle = t(`Goede antwoord: ${q.answer}`, `正确答案：${q.answer}`);
          let whyHtml = "";
          if (q.type === "choice" && q.wrongNl && q.wrongNl[lesson.selected]) {
            whyHtml = `<div class="fb-why">❌ <strong>${escapeHtml(lesson.selected)}</strong>: ${tBlock(q.wrongNl[lesson.selected], q.wrongZh[lesson.selected])}</div>`;
          } else if (q.type === "fill" && q.commonNl && q.commonNl[normalizeAns(lesson.selected)]) {
            whyHtml = `<div class="fb-why">❌ <strong>${escapeHtml(lesson.selected)}</strong>: ${tBlock(q.commonNl[normalizeAns(lesson.selected)], q.commonZh[normalizeAns(lesson.selected)])}</div>`;
          }
          fbDetail = `${whyHtml}<div style="margin-top:5px;">💡 ${tBlock(q.explainNl, q.explainZh)}</div>`;
          handleRecord(false, "q", q.id, step, `${q.promptNl} → ${q.answer}`);
        }
      }
      lesson.lastOk = ok; lesson.lastFbTitle = fbTitle; lesson.lastFbDetail = fbDetail;
      renderCurrentStep();
    }

    function handleRecord(ok, kind, id, step, summary) {
      if (ok) {
        state.xp += 10; state.streak += 1; delete state.mistakes[`${kind}:${id}`];
        if (!step.isRetry) lesson.firstTryRight++;
        playTone("ok");
      } else {
        state.streak = 0; state.mistakes[`${kind}:${id}`] = { kind, id }; playTone("err");
        if (lesson.isExam) lesson.examErrors.push(summary);
        else lesson.queue.push({ ...step, isRetry: true });
      }
      saveState();
    }

    function nextStep() {
      if (!lesson) return;
      lesson.queue.shift(); lesson.doneCount++; lesson.selected = null; lesson.sbPicked = []; lesson.checked = false;
      renderCurrentStep();
    }

    function renderVictoryScreen() {
      playTone("win");
      const lvId = lesson.lvId;
      state.completedLevels[lvId] = true;
      const prev = state.unlockedLevel;
      if (lvId >= state.unlockedLevel && lvId < LEVELS.length) state.unlockedLevel = lvId + 1;
      healUnlockedLevel();
      const unlockedNew = state.unlockedLevel > prev;
      state.xp += 30;
      document.getElementById("duo-bar-fill").style.width = "100%";
      document.getElementById("lesson-counter").textContent = "✓";
      const body = document.getElementById("lesson-body"), footer = document.getElementById("lesson-footer"), inner = document.getElementById("footer-inner");
      footer.className = "lesson-footer ok";

      if (lesson.isExam) {
        const cijfer = (1 + (lesson.firstTryRight / lesson.totalBase) * 9).toFixed(1);
        if (!state.bestCijfer || parseFloat(cijfer) > parseFloat(state.bestCijfer)) state.bestCijfer = cijfer;
        saveState(true);
        body.innerHTML = `<div class="victory-box"><h2 class="q-title">🏆 ${t("Eindtoets klaar!", "模拟考完成！")}</h2>
          <div class="cijfer-circle">${cijfer}<span>/ 10 Cijfer</span></div>
          <p class="q-sub"><strong>${lesson.firstTryRight} / ${lesson.totalBase}</strong> ${t("goed", "题答对")}</p>
          ${lesson.examErrors.length ? `<div class="review-list">${lesson.examErrors.map(e => `<div class="review-item">❌ ${escapeHtml(e)}</div>`).join("")}</div>` : `<div style="color:#166534; font-weight:900;">✨ 10!</div>`}</div>`;
        inner.innerHTML = `<div class="fb-text"><div class="fb-title">🎉 +30 XP</div></div><button class="duo-btn" onclick="exitLesson()">${t("TERUG NAAR KAART", "返回地图")}</button>`;
      } else {
        saveState(true);
        const nextLv = LEVELS.find(x => x.id === lvId + 1);
        body.innerHTML = `<div class="victory-box"><div style="font-size:4rem;">🏆✨</div>
          <h2 class="q-title">${t(`Level ${lvId} gehaald, Ernst!`, `第 ${lvId} 关通关！`)}</h2>
          <p class="q-sub">+30 XP · 🔥 ${state.streak}</p>
          ${unlockedNew && nextLv ? `<div style="display:inline-block; background:var(--gold-soft); border:2px solid var(--gold); border-radius:16px; padding:12px 18px; font-weight:900; color:#854d0e;">🔓 ${t(`Ontgrendeld: ${nextLv.icon} ${nextLv.titleNl}`, `已解锁：${nextLv.icon} ${nextLv.titleZh}`)}</div>` : ""}</div>`;
        inner.innerHTML = `<div class="fb-text"><div class="fb-title">🌟 +30 XP</div></div>
          <div style="display:flex; gap:10px;"><button class="duo-btn outline" onclick="exitLesson()">${t("KAART", "回地图")}</button>
          ${nextLv ? `<button class="duo-btn orange" onclick="startLevel(${nextLv.id})">LEVEL ${nextLv.id} →</button>` : ""}</div>`;
      }
    }

    function openGuide() {
      document.getElementById("guide-modal-title").textContent = t("📘 Nederlands Spiekbriefje: Doel & Middel", "📘 荷兰语秘籍：目的与途径信号词");
      document.getElementById("btn-guide-close").textContent = t("SLUITEN", "关闭并继续");
      document.getElementById("guide-modal-body").innerHTML = `
        <div class="guide-sec"><h3>🎯 1. Signaalwoorden van DOEL (目的)</h3>
          <p style="font-size:0.88rem;">• <strong>om ... te + hele werkwoord</strong>: Ik ga naar de supermarkt om melk te kopen. (⚠️ Niet bij vaste constructies zoals 'Ik vind het leuk om...')</p>
          <p style="font-size:0.88rem;">• <strong>opdat / zodat + bijzin</strong> (werkwoorden achteraan, géén 'te'!): opdat = schrijftaal, zodat = spreektaal. (⚠️ 'zodat' kan ook GEVOLG zijn!)</p>
        </div>
        <div class="guide-sec" style="margin-bottom:0;"><h3>🛠️ 2. Signaalwoorden van MIDDEL (途径/工具)</h3>
          <p style="font-size:0.88rem;">• <strong>met</strong> (+ naamwoord) · <strong>door middel van / middels</strong> (+ naamwoord, ❌ géén mens!)</p>
          <p style="font-size:0.88rem;">• <strong>met behulp van</strong> (+ naamwoord OF mens!) · <strong>door</strong> (+ naamwoord OF 'te + werkwoord'; ❌ passief/tunnel = géén middel!)</p>
          <p style="font-size:0.88rem;">• <strong>daarmee / waarmee</strong> (= met dat / met wat — middel niet herhalen!)</p>
        </div>`;
      document.getElementById("guide-modal").classList.add("open");
    }
    function closeGuide() { document.getElementById("guide-modal").classList.remove("open"); }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeGuide(); return; }
      if (document.getElementById("guide-modal").classList.contains("open") || !lesson || !lesson.active || e.key !== "Enter") return;
      const step = lesson.queue[0]; if (!step) return;
      if (step.kind.startsWith("teach_")) { nextStep(); return; }
      if (!lesson.checked) {
        const ready = step.kind === "sb" ? lesson.sbPicked.length > 0 : (lesson.selected !== null && String(lesson.selected).trim().length > 0);
        if (ready) checkCurrentStep();
      } else nextStep();
    });

    loadState(); renderMap(); syncCloudPull();
  </script>
</body>
</html>
